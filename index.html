<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Κληρώσεις &amp; Διαχείριση Αγώνων Φελλού — Ε.Ο.Υ.Δ.Α.</title>
<style>
  html, body { margin: 0; padding: 0; background: #F6F2E7; font-family: Arial, Helvetica, sans-serif; color: #243244; }
  * { box-sizing: border-box; }
  input, button, textarea { font-family: inherit; }
  .section-title { font-family: Georgia, serif; font-size: 15px; color: #1F3864; margin-bottom: 8px; border-bottom: 2px solid #D4AF37; padding-bottom: 4px; }
  .input { border: 1px solid #CFC7B0; border-radius: 4px; padding: 8px 10px; font-size: 14px; background: #fff; color: #243244; outline: none; min-width: 0; box-sizing: border-box; }
  .btn-primary-sm { background: #1F3864; color: #fff; border: none; border-radius: 4px; padding: 0 12px; cursor: pointer; height: 36px; flex-shrink: 0; }
  .btn-primary-lg { flex:1; background: #1F3864; color: #fff; border: 2px solid #D4AF37; border-radius: 4px; padding: 13px 0; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-primary-lg:disabled { background: #AEB6C2; border-color: #C9CDD4; cursor: not-allowed; }
  .btn-gold { background: #D4AF37; color: #1F3864; border: 2px solid #1F3864; border-radius: 4px; padding: 10px 16px; font-size: 13.5px; font-weight: bold; cursor: pointer; }
  .btn-gold:disabled { background: #E5DCC0; border-color: #C9CDD4; color: #9CA5AF; cursor: not-allowed; }
  .btn-secondary { background: #1F3864; color: #fff; border: none; border-radius: 4px; padding: 10px 16px; font-size: 13.5px; cursor: pointer; }
  .btn-ghost { background: transparent; color: #8A3B3B; border: 1px solid #C9A0A0; border-radius: 4px; padding: 10px 16px; font-size: 13.5px; cursor: pointer; }
  .btn-ghost-sm { background: #fff; color: #8A3B3B; border: 1px solid #C9A0A0; border-radius: 4px; padding: 0 14px; height: 36px; cursor: pointer; }
  .btn-link { background: none; border: none; color: #1F3864; cursor: pointer; font-size: 13px; font-weight: bold; padding: 4px; }
  .icon-btn { background: none; border: none; cursor: pointer; color: #8A93A0; padding: 2px; font-size: 15px; }
  .icon-btn-armed { background: #A33; border: none; cursor: pointer; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .club-card { background: #fff; border: 1px solid #E4DFCF; border-radius: 5px; padding: 12px; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; background: #F6F2E7; border: 1px solid #E4DFCF; border-radius: 20px; padding: 4px 9px; font-size: 12.5px; color: #243244; margin: 0 6px 6px 0; }
  .chip-armed { background: #A33; border-color: #A33; color: #fff; }
  .chip-btn { display: inline-flex; align-items: center; background: #fff; border: 1px solid #CFC7B0; border-radius: 20px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; color: #243244; margin: 0 6px 6px 0; }
  .summary-bar { display: flex; align-items: center; justify-content: space-between; background: #EFEAD9; border: 1px solid #DDD5C0; border-radius: 4px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #5A6472; }
  .error-text { color: #A33; font-size: 13px; margin-bottom: 10px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 6px; max-width: 440px; margin: 0 auto; border-bottom: 4px solid #1F3864; }
  .podium-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .podium-icon { font-size: 34px; line-height: 1; text-align: center; margin-bottom: 6px; }
  html, body { overflow-x: hidden; }
  .mode-card, .podium-col, .round-tab { box-sizing: border-box; }
  .podium-label { font-family: Georgia, serif; font-size: min(15px, 3.4vw); color: #1F3864; text-align: center; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podium-seal { display: block; margin: 8px auto 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #D4AF37, 0 2px 6px rgba(0,0,0,0.25); object-fit: contain; }
  .podium-step { position: relative; background: linear-gradient(180deg, #2A4A7F 0%, #1F3864 100%); border-top: 4px solid #D4AF37; border-radius: 4px 4px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; transition: filter .15s; }
  .podium-step.first { background: linear-gradient(180deg, #E2C35A 0%, #D4AF37 100%); border-top-color: #1F3864; }
  .podium-rank { font-family: Georgia, serif; font-size: 30px; font-weight: bold; color: #D4AF37; line-height: 1; }
  .podium-step.first .podium-rank { color: #1F3864; font-size: 38px; }
  .podium-saved { font-size: 11px; color: #C9D3E0; margin-top: 10px; }
  .podium-step.first .podium-saved { color: #1F3864; }
  .podium-col:active .podium-step { filter: brightness(1.12); }
  .podium-col:focus-visible { outline: 2px solid #D4AF37; outline-offset: 3px; }
  .round-tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .round-tab { border: 1px solid #1F3864; background: #fff; color: #1F3864; border-radius: 16px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .round-tab.active { background: #1F3864; color: #fff; }
  .round-tab.champ { border-color: #D4AF37; background: #FBF6E8; color: #1F3864; font-weight: bold; }
  .abs-btn { border: 1px solid #CFC7B0; background: #fff; color: #8A93A0; border-radius: 4px; padding: 3px 6px; font-size: 11px; cursor: pointer; font-family: inherit; }
  .abs-btn.on { border-color: #A33; color: #fff; background: #A33; font-weight: bold; }
  .mode-card { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; background: #fff; border: 1px solid #E4DFCF; border-left: 5px solid #1F3864; border-radius: 5px; padding: 16px 14px; margin-bottom: 12px; cursor: pointer; color: #243244; }
  .mode-card:active { background: #FBF6E8; }
  .mode-card.current { border-left-color: #D4AF37; }
  .part-tag { margin-left: 6px; font-size: 10.5px; cursor: pointer; padding: 1px 6px; border-radius: 8px; font-weight: bold; border: 1px solid #1F3864; color: #1F3864; background: #fff; }
  .part-tag.ind { border-color: #B8862F; color: #B8862F; }
  .part-tag.team { background: #1F3864; color: #fff; }
  .chip-team { border-color: #D4AF37; box-shadow: inset 0 0 0 1px #D4AF37; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
</style>
</head>

function quotaNoteHtml(Q){

}
function quotaNotePrint(Q){
  Q = Q || computeQuota();
  var c = Q.final ? Q_GREEN : Q_ORANGE;
  return '<div style="border:1px solid '+c+'; border-left:3px solid '+c+'; padding:4px 7px; margin:0 0 8px; font-size:8pt; color:'+(Q.final?'#1F4A2A':'#6B3410')+'; line-height:1.4;"><b>'+(Q.final?'Οριστική κατανομή:':'Σημείωση:')+'</b> '+esc(Q.final ? quotaFinalNote(Q).replace(/^Οριστική κατανομή\. /, '') : QUOTA_NOTE)+'</div>';

function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ var d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }
function jsStr(s){ return "'" + String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'"; }

function computeCapacities(total, n){
  if (n<=0 || total<=0) return [];
  var base = Math.ceil(total/n);
  var capacities = new Array(n).fill(base);
  if (n>1){ capacities[n-1] = total - base*(n-1); } else { capacities[0] = total; }
  return capacities;
}

function parseWeight(raw){
  if (!raw) return 0;
  var d = String(raw).replace(/[^\d]/g, "");
  return d ? parseInt(d, 10) : 0;
}

// Ranks a group of {athleteId, weight} by weight descending: standard
// skip-ranking among those who caught something (ties share a rank, next
// number skipped), plus article 36's rule for zero-catch athletes (they
// all share the average of the remaining tail positions, rounded up).
function rankGroupByWeight(list){
  var result = {};
  var sorted = list.slice().sort(function(a,b){ return b.weight - a.weight; });
  var caught = sorted.filter(function(a){ return a.weight > 0; });
  var zeroCatch = sorted.filter(function(a){ return a.weight === 0; });
  caught.forEach(function(a, idx){
    if (idx > 0 && a.weight === caught[idx-1].weight) result[a.athleteId] = result[caught[idx-1].athleteId];
    else result[a.athleteId] = idx + 1;
  });
  if (zeroCatch.length > 0){
    var nCaught = caught.length;
    var sumTail = zeroCatch.reduce(function(sum, _, i){ return sum + (nCaught + i + 1); }, 0);
    var avg = Math.ceil(sumTail / zeroCatch.length);
    zeroCatch.forEach(function(a){ result[a.athleteId] = avg; });
  }
  return result;
}

      logo: DEFAULT_LOGOS[clubName] || null,

    };
  });
}

/* ---------- persistent storage (best effort: Claude db > Claude window.storage > browser localStorage) ---------- */
var dbNS = null;
var LS_PREFIX = "eoyda_klirosi_";
function initDb(){
  return new Promise(function(resolve){
    try {
      if (typeof claude !== "undefined" && claude && claude.use) {
        claude.use("db").then(function(ns){ dbNS = ns; resolve(); }).catch(function(){ resolve(); });
      } else { resolve(); }
    } catch(e){ resolve(); }
  });
}
function storageGet(key){
  return new Promise(function(resolve){
    if (dbNS){
      dbNS.doc(key).get().then(function(snap){
        resolve(snap && snap.exists ? JSON.stringify(snap.data().value) : null);
      }).catch(function(){ resolve(null); });
      return;
    }
    if (typeof window !== "undefined" && window.storage){
      try {
        window.storage.get(key, false).then(function(res){ resolve(res ? res.value : null); }).catch(function(){ resolve(null); });
      } catch(e){ resolve(null); }
      return;
    }
    // Plain hosting (e.g. GitHub Pages): fall back to the browser's own storage.
    try {
      if (typeof localStorage === "undefined") return resolve(null);
      resolve(localStorage.getItem(LS_PREFIX + key));
    } catch(e){ resolve(null); }
  });
}
function storageSet(key, value){
  if (dbNS){
    try { dbNS.doc(key).set({ value: JSON.parse(value) }).catch(function(){}); } catch(e){}
    return;
  }
  if (typeof window !== "undefined" && window.storage){
    try { window.storage.set(key, value, false).catch(function(){}); } catch(e){}
    return;
  }
  try { if (typeof localStorage !== "undefined") localStorage.setItem(LS_PREFIX + key, value); } catch(e){}
}

function isOpenClub(c){ return !!c && (c.open === true || normalizeClubName(c.name) === normalizeClubName(OPEN_CLUB_NAME)); }
// Clubs that take part in the current type of competition: «ΟΠΕΝ» exists only in the Φιλικοί.
function modeClubs(){ return state.clubs.filter(function(c){ return state.mode === "friendly" || !isOpenClub(c); }); }
function ensureOpenClub(){
  var c = state.clubs.find(isOpenClub);
  if (!c){
    state.clubs.push({ id: uid(), name: OPEN_CLUB_NAME, open: true, color: "#2E7FB8", logo: OPEN_CLUB_LOGO, athletes: [] });
  } else {
    c.open = true;
    if (!c.logo) c.logo = OPEN_CLUB_LOGO;

}
function totalAthletes(){ return modeClubs().reduce(function(s,c){ return s + c.athletes.filter(function(a){return !a.absent;}).length; }, 0); }
function totalAbsent(){ return modeClubs().reduce(function(s,c){ return s + c.athletes.filter(function(a){return a.absent;}).length; }, 0); }
function activeClubs(){
  return modeClubs().map(function(c){ return Object.assign({}, c, { athletes: c.athletes.filter(function(a){return !a.absent;}) }); })
    .filter(function(c){ return c.athletes.length > 0; });
}
function canDraw(){ return state.numSectors >= 1 && activeClubs().length > 0 && totalAthletes() > 0; }
// Clubs with athletes first, most athletes on top; clubs without athletes
// (and ties) in alphabetical order.
function sortedClubs(){
  return modeClubs().sort(function(a,b){

  });
}

function cycleParticipation(clubId, athleteId){
  var c = findClub(clubId);
  if (!c) return;
  var a = c.athletes.find(function(x){ return x.id === athleteId; });
  if (!a) return;
  var i = PARTICIPATION_CYCLE.indexOf(participationOf(a));
  a.participation = PARTICIPATION_CYCLE[(i + 1) % PARTICIPATION_CYCLE.length];
  persistRoster();
  render();
}
function setClubTeamSize(clubId, raw){
  var c = findClub(clubId);
  if (!c) return;
  var n = parseInt(String(raw).replace(/[^0-9]/g, ""), 10);
  c.teamSize = n > 0 ? n : 5;
  persistRoster();
  render();

// Team = the first N athletes of the club, in entry order, who are not
// marked "Μόνο ατομικά" (N = the club's team size, default 5). An absent
// member stays in the team and counts with the absentee score, exactly as
// in the individual ranking — nobody moves up to replace them.
function teamMemberIdsForClub(c){
  return c.athletes.filter(function(a){ return !a.absent && participationOf(a) !== "ind"; })
    .slice(0, teamSizeOf(c)).map(function(a){ return a.id; });
}
function buildTeams(flat){
  var inDraw = {};
  flat.forEach(function(f){ inDraw[f.athleteId] = true; });
  var teams = [];
  state.clubs.forEach(function(c){
    var picked = c.athletes.filter(function(a){ return participationOf(a) !== "ind" && inDraw[a.id]; })
      .slice(0, teamSizeOf(c));
    if (!picked.some(function(a){ return inDraw[a.id]; })) return;
    teams.push({ clubId: c.id, clubName: c.name, color: c.color, logo: c.logo, size: teamSizeOf(c),
      memberIds: picked.map(function(a){ return a.id; }),
      absentMembers: picked.filter(function(a){ return !inDraw[a.id]; }).map(function(a){ return { id: a.id, name: a.name }; }) });
  });
  return teams;
}
function makeFlatEntry(athlete, club, sector, position){
  return { athleteId: athlete.id, athleteName: athlete.name, sponsor: athlete.sponsor || "", participation: participationOf(athlete),
    clubId: club.id, clubName: club.name, color: club.color, logo: club.logo, sector: sector, position: position };
}

// Πανελλήνιο: which athletes are scored in the team ranking and which in
// the individual ranking — each sector gets two independent rankings.
function tagPanFlags(flat, teams){
  var teamIds = {};
  teams.forEach(function(t){ t.memberIds.forEach(function(id){ teamIds[id] = true; }); });
  flat.forEach(function(f){
    f.inTeam = !!teamIds[f.athleteId];
    f.inIndividual = (f.participation || "both") !== "team";
  });
}
// How many team athletes the last sector (Ε) is short of, compared with Α.
// How many individual competitors the last sector is short of, compared
// with the first (e.g. 39 in 5 sectors → 8 vs 7 → 1).
function panTechLabel(flat, sIdx, nSectors){
  if (sIdx !== nSectors - 1) return "";
  var i = panIndDiff(flat) > 0, t = panTeamDiff(flat) > 0;
  return i && t ? "ατομικό & ομαδικό" : i ? "ατομικό" : t ? "ομαδικό" : "";
}
function panIndDiff(flat){
  var last = -1;
  flat.forEach(function(a){ if (a.sector > last) last = a.sector; });
  if (last < 1) return 0;
  var first = flat.filter(function(a){ return a.sector === 0 && a.inIndividual !== false; }).length;
  var lastN = flat.filter(function(a){ return a.sector === last && a.inIndividual !== false; }).length;
  return Math.max(0, first - lastN);
}
function panTeamDiff(flat){
  var n = state.sectorCapacities.length;
  if (n < 2) return 0;
  var first = flat.filter(function(a){ return a.sector === 0 && a.inTeam; }).length;
  var last = flat.filter(function(a){ return a.sector === n-1 && a.inTeam; }).length;
  return Math.max(0, first - last);
}

function panCounts(){
  var teams = 0, individual = 0, orphans = [];
  modeClubs().forEach(function(c){
    var teamIds = teamMemberIdsForClub(c);
    if (c.athletes.some(function(a){ return !a.absent && teamIds.indexOf(a.id) !== -1; })) teams++;
    c.athletes.forEach(function(a){
      if (a.absent) return;
      var p = participationOf(a);
      if (p !== "team") individual++;
      else if (teamIds.indexOf(a.id) === -1) orphans.push(a.name + " (" + c.name + ")");
    });
  });
  return { teams: teams, individual: individual, orphans: orphans };
}
// Seat order inside a sector: a uniformly random order among those where no
// two athletes of the same club sit side by side (rejection sampling). The
// old greedy method always put the biggest club on seats 1, 3, 5… — a visible
// pattern. If no valid order turns up (very tight sectors), fall back to a
// greedy order with random tie-breaks.
function arrangeSeatsNoAdjacentSameClub(members){
  function valid(order){
    for (var i = 1; i < order.length; i++) if (order[i].club.id === order[i-1].club.id) return false;
    return true;
  }
  for (var t = 0; t < 3000; t++){
    var candidate = shuffle(members);
    if (valid(candidate)) return candidate;
  }
  var byClub = {};
  members.forEach(function(g){ (byClub[g.club.id] = byClub[g.club.id] || []).push(g); });
  Object.keys(byClub).forEach(function(k){ byClub[k] = shuffle(byClub[k]); });
  var result = [], lastClubId = null;
  while (result.length < members.length){
    var candidates = shuffle(Object.keys(byClub).filter(function(k){ return byClub[k].length > 0; }));
    candidates.sort(function(x,y){ return byClub[y].length - byClub[x].length; });
    var chosen = candidates.filter(function(k){ return k !== lastClubId; })[0] || candidates[0];
    result.push(byClub[chosen].shift());
    lastClubId = chosen;
  }
  return result;
}

/* ---------- Πανελλήνιο: 3 αγωνιστικές ---------- */
// The working copy (state.flatAssignments, weights, …) is always the round
// on screen; switching rounds writes it back into state.rounds first.
var ROUND_FIELDS = ["flatAssignments", "sectorCapacities", "weights", "rankings", "teamRankings", "roundAbsent"];
function isChampionship(){ return state.mode === "panhellenic" && state.rounds && state.rounds.length > 0; }
function syncRoundOut(){
  if (!isChampionship()) return;
  var r = state.rounds[state.currentRound];
  ROUND_FIELDS.forEach(function(f){ r[f] = state[f]; });
}
function applyRound(i){
  state.currentRound = i;
  var r = state.rounds[i];
  ROUND_FIELDS.forEach(function(f){ state[f] = r[f]; });
  if (!state.roundAbsent) state.roundAbsent = {};
  if (!state.weights) state.weights = {};
  state.revealedCount = state.flatAssignments.length;
  state.teamStandings = [];
}
function goRound(i){
  syncRoundOut();
  applyRound(i);
  state.stage = "result";
  render();
}
function toggleRoundAbsent(athleteId){
  if (!state.roundAbsent) state.roundAbsent = {};
  if (state.roundAbsent[athleteId]) delete state.roundAbsent[athleteId];
  else state.roundAbsent[athleteId] = true;
  state.rankings = null;
  state.teamRankings = null;
  render();
}

var PERM_CACHE = {};
function kPermutations(arr, k){
  var key = arr.join(",") + "|" + k;
  if (PERM_CACHE[key]) return PERM_CACHE[key];
  var out = [];
  (function rec(prefix, rest){
    if (prefix.length === k){ out.push(prefix); return; }
    rest.forEach(function(x, i){ rec(prefix.concat([x]), rest.slice(0,i).concat(rest.slice(i+1))); });
  })([], arr);
  PERM_CACHE[key] = out;
  return out;
}

// One round of the Πανελλήνιο draw. `used[athleteId][sector]` marks sectors an
// athlete already fished in earlier rounds — those are forbidden, so every
// athlete changes sector each αγωνιστική.
// `strict` (default): nobody may repeat a sector. strict === false lets
// individual-only athletes repeat a sector when the numbers leave no other
// way (e.g. a team of 4 always leaves Ε one short, and a single «μόνο
// ατομικά» athlete has to fill it) — they still prefer a new sector.
function panPlaceRound(teamEntries, extras, targets, used, strict){
  if (strict === undefined) strict = true;
  var N = targets.length;
  var ALL = [], FIRST = [];
  for (var q = 0; q < N; q++){ ALL.push(q); if (q < N-1) FIRST.push(q); }
  function isUsed(g, s){ return used[g.athlete.id] && used[g.athlete.id][s]; }
  for (var attempt = 0; attempt < 400; attempt++){
    var placed = ALL.map(function(){ return []; }), indCount = ALL.map(function(){ return 0; }), clubCount = ALL.map(function(){ return {}; }), ok = true;
    // Teams: one member per sector. A team smaller than the sector count
    // never goes to the last sector, which becomes technical for the team
    // ranking. Among valid assignments keep the individual counts as close
    // to each sector's target as possible.
    shuffle(teamEntries).forEach(function(team){
      if (!ok) return;
      var sectors = team.length < N ? FIRST : ALL;
      var members = shuffle(team);
      var best = null, bestScore = Infinity, ties = 0;
      kPermutations(sectors, members.length).forEach(function(perm){
        for (var i = 0; i < members.length; i++) if (isUsed(members[i], perm[i])) return;
        var ic = indCount.slice();
        for (var j = 0; j < members.length; j++) if (participationOf(members[j].athlete) !== "team") ic[perm[j]]++;
        var over = 0, lo = Infinity, hi = -Infinity;
        for (var k = 0; k < N; k++){
          if (ic[k] > targets[k]) over = 1000;
          var rem = targets[k] - ic[k];
          if (rem < lo) lo = rem; if (rem > hi) hi = rem;
        }
        var score = over + hi - lo;
        if (score < bestScore){ best = perm; bestScore = score; ties = 1; }
        else if (score === bestScore){ ties++; if (Math.random() < 1/ties) best = perm; }
      });
      if (!best || bestScore >= 1000){ ok = false; return; }
      members.forEach(function(g, i){
        var sIdx = best[i];
        placed[sIdx].push(g);
        if (participationOf(g.athlete) !== "team") indCount[sIdx]++;
        clubCount[sIdx][g.club.id] = (clubCount[sIdx][g.club.id] || 0) + 1;
      });
    });
    if (!ok) continue;
    // Individual-only athletes fill each sector up to its target.
    shuffle(extras).forEach(function(g){
      if (!ok) return;
      var open = shuffle(ALL.filter(function(s){ return indCount[s] < targets[s] && (!strict || !isUsed(g, s)); }));
      if (!open.length){ ok = false; return; }
      open.sort(function(a,b){
        return ((isUsed(g,a)?1:0) - (isUsed(g,b)?1:0)) || ((clubCount[a][g.club.id]||0) - (clubCount[b][g.club.id]||0)) || ((targets[b]-indCount[b]) - (targets[a]-indCount[a]));
      });
      var sIdx = open[0];
      placed[sIdx].push(g);
      indCount[sIdx]++;
      clubCount[sIdx][g.club.id] = (clubCount[sIdx][g.club.id] || 0) + 1;
    });
    if (ok && indCount.every(function(n, s){ return n === targets[s]; })) return placed;
  }
  return null;
}

// Sector rankings of one Πανελλήνιο round (individual and team, each 1..N).
// Athletes absent that day keep their (empty) seat and get the sector's
// maximum rank plus one — N+1, e.g. 7+1 = 8 in a sector of 7.
function panRankRound(flat, caps, weights, absent){
  absent = absent || {};
  var ind = {}, team = {};
  var diff = panTeamDiff(flat);
  var indDiff = panIndDiff(flat);
  function w(a){ return { athleteId: a.athleteId, weight: parseWeight(weights[a.athleteId]) }; }
  function present(a){ return !absent[a.athleteId]; }
  function giveAbsent(target, group, borrowedCount){
    var sectorSize = group.length + (borrowedCount || 0);
    group.filter(function(a){ return !present(a); }).forEach(function(a){ target[a.athleteId] = sectorSize + 1; });
  }
  for (var ps = 0; ps < caps.length; ps++){
    var inSector = flat.filter(function(a){ return a.sector === ps; });
    var indGroup = inSector.filter(function(a){ return a.inIndividual !== false; });
    if (ps === caps.length - 1 && indDiff > 0){
      // Technical sector (individual ranking, Παράδειγμα 2): borrow the
      // individual athletes in the last seats of the previous sector; their
      // rank here is left unused.
      var prevInd = flat.filter(function(a){ return a.sector === ps-1 && a.inIndividual !== false; })
        .sort(function(a,b){ return a.position - b.position; }).slice(-indDiff);
      var realInd = indGroup.filter(present).map(w);
      var combInd = realInd.concat(prevInd.filter(present).map(function(b){ return { athleteId: "__borrowedInd__"+b.athleteId, weight: parseWeight(weights[b.athleteId]) }; }));
      var cri = rankGroupByWeight(combInd);
      realInd.forEach(function(a){ ind[a.athleteId] = cri[a.athleteId]; });
      giveAbsent(ind, indGroup, indDiff);
    } else {
      Object.assign(ind, rankGroupByWeight(indGroup.filter(present).map(w)));
      giveAbsent(ind, indGroup);
    }
    var teamGroup = inSector.filter(function(a){ return a.inTeam; });
    var borrowedCount = 0;
    if (ps === caps.length - 1 && diff > 0){
      // Technical sector (team ranking): borrow, from Δ, the team athlete of
      // each club missing from Ε, so every club is compared in Ε too.
      var clubsInE = {};
      teamGroup.forEach(function(a){ clubsInE[a.clubId] = true; });
      var prevTeam = flat.filter(function(a){ return a.sector === ps-1 && a.inTeam && !clubsInE[a.clubId] && present(a); });
      borrowedCount = flat.filter(function(a){ return a.sector === ps-1 && a.inTeam && !clubsInE[a.clubId]; }).length;
      var realTeam = teamGroup.filter(present).map(w);
      var combined = realTeam.concat(prevTeam.map(function(b){ return { athleteId: "__borrowed__"+b.athleteId, weight: parseWeight(weights[b.athleteId]) }; }));
      var cr = rankGroupByWeight(combined);
      realTeam.forEach(function(a){ team[a.athleteId] = cr[a.athleteId]; });
    } else {
      Object.assign(team, rankGroupByWeight(teamGroup.filter(present).map(w)));
    }
    giveAbsent(team, teamGroup, borrowedCount);
  }
  return { ind: ind, team: team };
}

function sectorOffsetsOf(caps){
  var out = [], running = 0;
  for (var i = 0; i < caps.length; i++){ out.push(running); running += caps[i]; }
  return out;
}

// Ημερήσια ατομική (άρθρο 33δ/35): lower penalty, then heavier catch.
function individualRows(flat, caps, weights, rankings, excludeTeamOnly, absent){
  absent = absent || {};
  var offs = sectorOffsetsOf(caps);
  var sorted = flat.filter(function(a){ return !(excludeTeamOnly && a.inIndividual === false); }).sort(function(a,b){
    return ((rankings[a.athleteId]||0) - (rankings[b.athleteId]||0)) || (parseWeight(weights[b.athleteId]) - parseWeight(weights[a.athleteId]));
  });
  var rows = [];
  sorted.forEach(function(a, idx){
    var prev = sorted[idx-1];
    var same = idx > 0 && rankings[a.athleteId] === rankings[prev.athleteId] && parseWeight(weights[a.athleteId]) === parseWeight(weights[prev.athleteId]);
    rows.push(Object.assign({}, a, {
      score: rankings[a.athleteId], weight: parseWeight(weights[a.athleteId]),
      localPosition: a.position - offs[a.sector], place: same ? rows[idx-1].place : idx + 1,
      roundAbsent: !!absent[a.athleteId]
    }));
  });
  // Ισόβαθμοι χωρίς αλίευμα (0 γρ., ίδιος βαθμός ποινής): take the average of
  // the positions they occupy, rounded up — e.g. 33,34,35 → 34 for all three.
  for (var i = 0; i < rows.length; ){
    var j = i;
    while (j + 1 < rows.length && rows[j+1].place === rows[i].place) j++;
    if (j > i && rows[i].weight === 0){
      var sum = 0;
      for (var k = i; k <= j; k++) sum += k + 1;
      var avg = Math.ceil(sum / (j - i + 1));
      for (var m = i; m <= j; m++) rows[m].place = avg;
    }
    i = j + 1;
  }
  return rows;
}

// Ημερήσια ομαδική (άρθρα 34–35): best 4 of the five (a team of 4 counts all
// 4), lower sum first, then the weight of those 4.
function teamRows(flat, caps, weights, teamRanks, teams, absent){
  absent = absent || {};
  var offs = sectorOffsetsOf(caps);
  var byId = {};
  flat.forEach(function(a){ byId[a.athleteId] = a; });
  // Άρθρο 34: the best (sectors − 1) of the declared team — 4 of the five
  // with the usual 5 sectors; a team one short counts all its members.
  var COUNTED = Math.max(1, (caps.length || 5) - 1);
  var rows = (teams || []).map(function(t){
    var members = t.memberIds.filter(function(id){ return byId[id]; }).map(function(id){
      var a = byId[id];
      return { athleteId: id, athleteName: a.athleteName, score: teamRanks[id] || 0, weight: parseWeight(weights[id]),
        sector: a.sector, localPosition: a.position - offs[a.sector], roundAbsent: !!absent[id] };
    });
    var order = members.slice().sort(function(x,y){ return (x.score - y.score) || (y.weight - x.weight); });
    order.forEach(function(m, i){ m.counted = i < COUNTED; });
    var counted = order.slice(0, COUNTED);
    return {
      clubId: t.clubId, clubName: t.clubName, color: t.color, logo: t.logo, size: t.size, members: order,
      totalScore: counted.reduce(function(s,m){ return s + m.score; }, 0),
      totalWeight: counted.reduce(function(s,m){ return s + m.weight; }, 0),
      complete: members.length >= COUNTED
    };
  });
  rows.sort(function(a,b){
    if (a.complete !== b.complete) return a.complete ? -1 : 1;
    return (a.totalScore - b.totalScore) || (b.totalWeight - a.totalWeight);
  });
  rows.forEach(function(r, idx){
    var prev = rows[idx-1];
    var tied = prev && prev.complete === r.complete && prev.totalScore === r.totalScore && prev.totalWeight === r.totalWeight;
    r.place = tied ? prev.place : idx + 1;
  });
  return rows;
}

function roundHasResults(r){
  return Object.keys(r.weights || {}).some(function(k){ return parseWeight(r.weights[k]) > 0; }) ||
         Object.keys(r.roundAbsent || {}).length > 0;
}

// Συνολική κατάταξη πρωταθλήματος (άρθρο 35) — no round is ever dropped.
function openChampionship(){
  syncRoundOut();
  var nameInput = document.getElementById("saveNameInput");
  if (nameInput) state.saveNameInput = nameInput.value;
  var rounds = state.rounds;
  var n = rounds.length;
  var dailyInd = [], dailyTeam = [], counted = 0;
  rounds.forEach(function(r, i){
    if (!roundHasResults(r)){ dailyInd.push(null); dailyTeam.push(null); return; }
    counted++;
    var rk = panRankRound(r.flatAssignments, r.sectorCapacities, r.weights || {}, r.roundAbsent);
    var ir = {}; individualRows(r.flatAssignments, r.sectorCapacities, r.weights || {}, rk.ind, true, r.roundAbsent).forEach(function(x){ ir[x.athleteId] = x; });
    var tr = {}; teamRows(r.flatAssignments, r.sectorCapacities, r.weights || {}, rk.team, state.teams, r.roundAbsent).forEach(function(x){ tr[x.clubId] = x; });
    dailyInd.push(ir); dailyTeam.push(tr);
  });

  // Individual: sum of penalty points → total weight → best daily placing.
  var athletes = rounds[0].flatAssignments.filter(function(a){ return a.inIndividual !== false; });
  var ind = athletes.map(function(a){
    var per = dailyInd.map(function(d){ return d ? d[a.athleteId] || null : null; });
    var got = per.filter(Boolean);
    return {
      athleteId: a.athleteId, athleteName: a.athleteName, clubName: a.clubName, sponsor: a.sponsor || "", color: a.color, logo: a.logo,
      per: per,
      totalScore: got.reduce(function(s,x){ return s + (x.score || 0); }, 0),
      totalWeight: got.reduce(function(s,x){ return s + x.weight; }, 0),
      bestPlace: got.length ? Math.min.apply(null, got.map(function(x){ return x.place; })) : Infinity
    };
  });
  ind.sort(function(a,b){ return (a.totalScore - b.totalScore) || (b.totalWeight - a.totalWeight) || (a.bestPlace - b.bestPlace); });
  ind.forEach(function(r, idx){
    var p = ind[idx-1];
    r.place = (p && p.totalScore === r.totalScore && p.totalWeight === r.totalWeight && p.bestPlace === r.bestPlace) ? p.place : idx + 1;
  });

  // Team: sum of daily team placings → sum of daily team weight → best daily placing.
  var team = (state.teams || []).map(function(t){
    var per = dailyTeam.map(function(d){ return d ? d[t.clubId] || null : null; });
    var got = per.filter(Boolean);
    return {
      clubId: t.clubId, clubName: t.clubName, color: t.color, logo: t.logo, per: per,
      totalPlaces: got.reduce(function(s,x){ return s + x.place; }, 0),
      totalPenalty: got.reduce(function(s,x){ return s + x.totalScore; }, 0),
      totalWeight: got.reduce(function(s,x){ return s + x.totalWeight; }, 0)
    };
  });
  // Ισοβαθμία: σύνολο βαθμών ποινής όλων των αγωνιστικών, μετά σύνολο βάρους.
  team.sort(function(a,b){ return (a.totalPlaces - b.totalPlaces) || (a.totalPenalty - b.totalPenalty) || (b.totalWeight - a.totalWeight); });
  team.forEach(function(r, idx){
    var p = team[idx-1];
    r.place = (p && p.totalPlaces === r.totalPlaces && p.totalPenalty === r.totalPenalty && p.totalWeight === r.totalWeight) ? p.place : idx + 1;
  });

  state.champInd = ind;
  state.champTeam = team;
  state.champRoundsCounted = counted;
  state.stage = "championship";
  render();
}

/* ---------- Περιφερειακά: συγκεντρωτική κατάταξη σειράς αγώνων ---------- */
function toggleSeriesSel(id){
  if (state.seriesSel[id]) delete state.seriesSel[id]; else state.seriesSel[id] = true;
  render();
}
function seriesKey(name){ return normalizeClubName(String(name || "")).replace(/\s+/g, " ").trim(); }

// Συνολική ατομική (άρθρο 35): sum of penalty points of all races → total
// weight → best single-race placing. An athlete missing from a race (absent
// or not entered) gets that race's absentee score: worst score + 1.
// Series ranking for a set of saved races (art. 35), split into valid
// athletes (raced at least `minRaces` of them) and the rest.
function computeSeries(races, minRaces){
  var athletes = {}, order = [];
  var perRace = races.map(function(d){
    var caps = d.sectorCapacities, w = d.weights || {};
    var rk = regionalRankRound(d.flatAssignments, caps, w);
    var rows = individualRows(d.flatAssignments, caps, w, rk, false, {});
    var scores = rows.map(function(r){ return r.score || 0; });
    var absentScore = (scores.length ? Math.max.apply(null, scores) : 0) + 1;
    var byKey = {};
    rows.forEach(function(r){
      var k = seriesKey(r.athleteName);
      byKey[k] = { score: r.score, weight: r.weight, place: r.place };
      if (!athletes[k]){ athletes[k] = { athleteName: r.athleteName, clubName: r.clubName, sponsor: r.sponsor || "", color: r.color, logo: r.logo }; order.push(k); }
      else if (!athletes[k].sponsor && r.sponsor) athletes[k].sponsor = r.sponsor;
    });
    (d.absentAthletes || []).forEach(function(a){
      var k = seriesKey(a.name);
      if (!athletes[k]){ athletes[k] = { athleteName: a.name, clubName: a.clubName }; order.push(k); }
    });
    return { byKey: byKey, absentScore: absentScore, absentPlace: rows.length + 1 };
  });
  var need = Math.min(minRaces || races.length, races.length);
  var out = order.map(function(k){
    var a = athletes[k];
    var raced = 0;
    var per = perRace.map(function(pr){
      var x = pr.byKey[k];
      if (x){ raced++; return x; }
      return { score: pr.absentScore, weight: 0, place: pr.absentPlace, missing: true };
    });
    return {
      athleteName: a.athleteName, clubName: a.clubName, sponsor: a.sponsor || "", color: a.color, logo: a.logo, per: per,
      raced: raced, valid: raced >= need,
      totalScore: per.reduce(function(s,x){ return s + x.score; }, 0),
      totalWeight: per.reduce(function(s,x){ return s + x.weight; }, 0),
      bestPlace: Math.min.apply(null, per.map(function(x){ return x.place; }))
    };
  });
  function rank(list){
    list.sort(function(a,b){ return (a.totalScore - b.totalScore) || (b.totalWeight - a.totalWeight) || (a.bestPlace - b.bestPlace); });
    list.forEach(function(r, i){
      var p = list[i-1];
      r.place = (p && p.totalScore === r.totalScore && p.totalWeight === r.totalWeight && p.bestPlace === r.bestPlace) ? p.place : i + 1;
    });
    return list;
  }
  // Everyone is ranked together by their score; athletes short of the
  // required races are flagged «Μη έγκυρος» and never take a final place.
  var all = rank(out);
  return { all: all, valid: all.filter(function(r){ return r.valid; }), invalid: all.filter(function(r){ return !r.valid; }), need: need };
}

function openSeriesRanking(){
  var races = state.savedDraws.filter(function(d){ return state.seriesSel[d.id] && drawModeOf(d) === state.mode; })
    .sort(function(a,b){ return String(a.savedAt).localeCompare(String(b.savedAt)); });
  if (races.length < 2) return;
  var res = computeSeries(races, state.quota.minRaces);
  var regions = {};
  races.forEach(function(d){ if (d.region) regions[normalizeClubName(d.region)] = d.region; });
  var regionNames = Object.keys(regions).map(function(k){ return regions[k]; });
  state.seriesRegion = regionNames.length === 1 ? regionNames[0] : "";
  // Top N valid athletes qualify, N = the region's share of the final places.
  var qualifies = 0;
  if (state.seriesRegion){
    var alloc = computeQuota().rows.find(function(r){ return normalizeClubName(r.region) === normalizeClubName(state.seriesRegion); });
    if (alloc) qualifies = alloc.places;
  }
  var taken = 0;
  res.all.forEach(function(r){ r.qualifies = false; if (r.valid && taken < qualifies){ r.qualifies = true; taken++; } });
  // Χορηγοί και Αλυτάρχης κάθε αγώνα: αναφέρονται μόνο στη γραμμή του αγώνα.
  state.seriesRaces = races.map(function(d){
    var ri = d.raceInfo || {};
    var sps = (ri.sponsors || []).filter(function(sp){ return sp && (String(sp.name || "").trim() || sp.logo); })
      .map(function(sp){ return { name: String(sp.name || "").trim(), logo: sp.logo || null }; });
    return { name: d.name, savedAt: d.savedAt, region: d.region || "", referee: String(ri.referee || "").trim(), sponsors: sps };
  });
  state.seriesRows = res.all;
  state.seriesInvalid = [];
  state.seriesInvalidCount = res.invalid.length;
  state.seriesNeed = res.need;
  state.seriesQualifies = qualifies;
  state.seriesQuotaFinal = computeQuota().final;
  state.stage = "series";
  render();
}

/* ---------- Κατανομή θέσεων τελικού (μέθοδος μεγαλύτερου υπολοίπου) ---------- */
function persistQuota(){ storageSet(QUOTA_KEY, JSON.stringify(state.quota)); }
function regionDatalist(){
  var names = {};
  state.savedDraws.forEach(function(d){ if (d.region) names[normalizeClubName(d.region)] = d.region; });
  Object.keys(state.quota.manual || {}).forEach(function(r){ names[normalizeClubName(r)] = names[normalizeClubName(r)] || r; });
  return '<datalist id="regionList">' + Object.keys(names).map(function(k){ return '<option value="'+esc(names[k])+'"></option>'; }).join("") + '</datalist>';
}
function editDrawRegion(id){
  var d = state.savedDraws.find(function(x){ return x.id === id; });
  if (!d) return;
  var v = window.prompt("Περιφέρεια του αγώνα «" + d.name + "»:", d.region || "");
  if (v === null) return;
  d.region = v.trim();
  storageSet(SAVED_DRAWS_KEY, JSON.stringify(state.savedDraws));
  render();
}
function computeQuota(){
  var q = state.quota;
  var byRegion = {};
  state.savedDraws.forEach(function(d){
    if (drawModeOf(d) !== "regional" || !d.region) return;
    var k = normalizeClubName(d.region);
    (byRegion[k] = byRegion[k] || { region: d.region, races: [] }).races.push(d);
  });
  Object.keys(q.manual || {}).forEach(function(r){
    var k = normalizeClubName(r);
    if (!byRegion[k]) byRegion[k] = { region: r, races: [] };
  });
  var rows = Object.keys(byRegion).map(function(k){
    var g = byRegion[k];
    var auto = g.races.length ? computeSeries(g.races, q.minRaces).valid.length : null;
    var manualRaw = (q.manual || {})[g.region];
    var manual = manualRaw === undefined || manualRaw === "" ? null : parseInt(manualRaw, 10);
    var lock = quotaLockOf(g.region);
    return { region: g.region, races: g.races.length, auto: auto, manual: isNaN(manual) ? null : manual,
      // Κλειδωμένη περιφέρεια: οι έγκυροι μένουν όπως ήταν τη στιγμή του κλειδώματος.
      locked: !!lock, lockedAt: lock ? lock.at : null,
      valid: lock ? lock.valid : (manual !== null && !isNaN(manual) ? manual : (auto || 0)) };
  }).sort(function(a,b){ return a.region.localeCompare(b.region, "el"); });
  var total = rows.reduce(function(s,r){ return s + r.valid; }, 0);
  var places = parseInt(q.places, 10) || 0;
  rows.forEach(function(r){
    r.exact = total ? places * r.valid / total : 0;
    r.places = Math.floor(r.exact);
    r.rem = r.exact - r.places;
  });
  var left = places - rows.reduce(function(s,r){ return s + r.places; }, 0);
  rows.slice().sort(function(a,b){ return (b.rem - a.rem) || (b.valid - a.valid); }).forEach(function(r){
    if (left > 0 && total > 0){ r.places++; r.bonus = true; left--; }
  });
  var locked = rows.filter(function(r){ return r.locked; });
  var lastAt = locked.reduce(function(m, r){ return !m || r.lockedAt > m ? r.lockedAt : m; }, null);
  return { rows: rows, total: total, places: places, lockedCount: locked.length,
    final: rows.length > 0 && locked.length === rows.length, lockedAt: lastAt };
}
function quotaLockOf(region){
  var L = state.quota.locked || {}, k = normalizeClubName(region);
  for (var r in L) if (normalizeClubName(r) === k) return L[r];
  return null;
}
function lockQuotaRegion(region){
  var row = computeQuota().rows.find(function(r){ return normalizeClubName(r.region) === normalizeClubName(region); });
  if (!row) return;
  if (!window.confirm("Κλείδωμα της Περιφέρειας «" + region + "» με " + row.valid + " έγκυρους;\n\nΟ αριθμός παγώνει και δεν αλλάζει από νέους αγώνες. Όταν κλειδώσουν όλες οι Περιφέρειες, η κατανομή γίνεται οριστική.")) return;
  state.quota.locked = state.quota.locked || {};
  state.quota.locked[region] = { valid: row.valid, at: new Date().toISOString() };
  persistQuota(); render();
}
function unlockQuotaRegion(region){
  if (!window.confirm("Ξεκλείδωμα της Περιφέρειας «" + region + "»;\n\nΗ κατανομή γίνεται ξανά προσωρινή.")) return;
  var L = state.quota.locked || {}, k = normalizeClubName(region);
  Object.keys(L).forEach(function(r){ if (normalizeClubName(r) === k) delete L[r]; });
  persistQuota(); render();
}
function goQuota(){ state.stage = "quota"; render(); }
function setQuotaPlaces(v){ state.quota.places = parseInt(String(v).replace(/[^0-9]/g, ""), 10) || 0; persistQuota(); render(); }
function setQuotaMin(v){ state.quota.minRaces = Math.max(1, parseInt(String(v).replace(/[^0-9]/g, ""), 10) || 1); persistQuota(); render(); }
function setQuotaManual(region, v){
  state.quota.manual = state.quota.manual || {};
  v = String(v).replace(/[^0-9]/g, "");
  if (v === "") delete state.quota.manual[region]; else state.quota.manual[region] = v;
  persistQuota(); render();
}
function addQuotaRegion(){
  var inp = document.getElementById("newQuotaRegion");
  var name = inp ? inp.value.trim() : "";
  if (!name) return;
  state.quota.manual = state.quota.manual || {};
  if (state.quota.manual[name] === undefined) state.quota.manual[name] = "0";
  persistQuota(); render();
}
function removeQuotaRegion(region){
  if (state.quota.manual) delete state.quota.manual[region];
  if (state.quota.locked) Object.keys(state.quota.locked).forEach(function(r){ if (normalizeClubName(r) === normalizeClubName(region)) delete state.quota.locked[r]; });
  persistQuota(); render();
}

// Shrink the logo to at most 360 px before storing it: PNG when the image
// has transparent pixels (keeps the cut-out look), JPEG otherwise (smaller).
function setRaceSponsorLogo(id, file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var MAX = 360;
      var scale = Math.min(1, MAX / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      var ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      var transparent = false;
      try {
        var data = ctx.getImageData(0, 0, w, h).data;
        for (var i = 3; i < data.length; i += 4){ if (data[i] < 250){ transparent = true; break; } }
      } catch(e){}
      var out;
      if (transparent) out = cv.toDataURL("image/png");
      else {
        var cv2 = document.createElement("canvas"); cv2.width = w; cv2.height = h;
        var c2 = cv2.getContext("2d"); c2.fillStyle = "#fff"; c2.fillRect(0, 0, w, h); c2.drawImage(cv, 0, 0);
        out = cv2.toDataURL("image/jpeg", 0.86);
      }
      var sp = (state.raceInfo.sponsors || []).find(function(x){ return x.id === id; });
      if (sp){ sp.logo = out; persistRaceInfo(); render(); }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- Εισαγωγή αγώνα από το Excel/CSV που εξάγει η εφαρμογή ---------- */
function parseCsvText(text){
  text = text.replace(/^\uFEFF/, "");
  var firstLine = text.split(/\r?\n/)[0] || "";
  var delim = [";", ",", "\t"].sort(function(a,b){ return firstLine.split(b).length - firstLine.split(a).length; })[0];
  var rows = [], row = [], cell = "", q = false;
  for (var i = 0; i < text.length; i++){
    var ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){
      if (ch === "\r" && text[i+1] === "\n") i++;
      row.push(cell); cell = ""; if (row.some(function(c){ return c.trim() !== ""; })) rows.push(row); row = [];
    } else cell += ch;
  }
  row.push(cell); if (row.some(function(c){ return c.trim() !== ""; })) rows.push(row);
  return rows;
}
function sectorIndexFromLetters(letters){
  var L = normalizeClubName(letters).toUpperCase();
  var latin = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var gi = SECTOR_LETTERS.map(function(x){ return normalizeClubName(x).toUpperCase(); }).indexOf(L);
  if (gi !== -1) return gi;
  if (L.length === 1 && latin.indexOf(L) !== -1) return latin.indexOf(L);
  return -1;
}
function triggerImportCsv(){
  var inp = document.getElementById("csvImportInput");
  if (inp) inp.click();
}
function importRaceCsv(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try { importRaceCsvText(String(reader.result), file.name); }
    catch(e){ state.importMsg = "✕ Το αρχείο δεν διαβάστηκε: " + e.message; render(); }
  };
  reader.readAsText(file, "utf-8");
}
function importRaceCsvText(text, fileName){
  var rows = parseCsvText(text);
  if (rows.length < 2) throw new Error("κενό αρχείο");
  var H = rows[0].map(function(h){ return normalizeClubName(h); });
  function col(name){ return H.indexOf(normalizeClubName(name)); }
  var cPos = col("ΘΕΣΗ"), cName = col("ΟΝΟΜΑ ΑΘΛΗΤΗ"), cClub = col("ΣΥΛΛΟΓΟΣ"), cSp = col("ΧΟΡΗΓΟΣ"), cW = col("ΒΑΡΟΣ");
  if (cPos < 0 || cName < 0 || cClub < 0) throw new Error("δεν είναι Φύλλο Αγώνα της εφαρμογής (λείπουν οι στήλες ΘΕΣΗ / ΟΝΟΜΑ ΑΘΛΗΤΗ / ΣΥΛΛΟΓΟΣ)");
  var flat = [], weights = {}, seenPos = {}, maxSector = -1, clubCache = {};
  rows.slice(1).forEach(function(r, idx){
    var posRaw = String(r[cPos] || "").trim();
    var name = String(r[cName] || "").trim();
    if (!posRaw || !name) return;
    var m = posRaw.match(/^([^\d\s]+)\s*(\d+)$/);
    if (!m) throw new Error("γραμμή " + (idx+2) + ": άκυρη θέση «" + posRaw + "»");
    var sector = sectorIndexFromLetters(m[1]);
    if (sector < 0) throw new Error("γραμμή " + (idx+2) + ": άγνωστος τομέας «" + m[1] + "»");
    var position = parseInt(m[2], 10);
    if (seenPos[position]) throw new Error("η θέση " + position + " εμφανίζεται δύο φορές");
    seenPos[position] = true;
    maxSector = Math.max(maxSector, sector);
    var clubName = String(r[cClub] || "").trim();
    var ck = normalizeClubName(clubName);
    if (!clubCache[ck]){
      var rc = state.clubs.find(function(c){ return normalizeClubName(c.name) === ck; });
      clubCache[ck] = rc || { id: "imp-" + ck, name: clubName, color: CLUB_COLORS[Object.keys(clubCache).length % CLUB_COLORS.length], logo: null, athletes: [] };
    }
    var club = clubCache[ck];
    var ra = club.athletes.find(function(a){ return seriesKey(a.name) === seriesKey(name); });
    var athlete = { id: ra ? ra.id : uid(), name: name, sponsor: cSp >= 0 ? String(r[cSp] || "").trim() : (ra ? ra.sponsor : "") };
    var entry = makeFlatEntry(athlete, club, sector, position);
    entry.clubName = clubName || club.name;
    flat.push(entry);
    var w = cW >= 0 ? String(r[cW] || "").trim().replace(/\s*(γρ\.?|gr)$/i, "").replace(",", ".") : "";
    weights[entry.athleteId] = /^\d+(\.\d+)?$/.test(w) ? w : "";
  });
  if (!flat.length) throw new Error("δεν βρέθηκαν αθλητές");
  var caps = [];
  for (var s = 0; s <= maxSector; s++){
    var cnt = flat.filter(function(a){ return a.sector === s; }).length;
    if (!cnt) throw new Error("ο τομέας " + sectorLabel(s) + " δεν έχει αθλητές");
    caps.push(cnt);
  }
  // Name and date come from the exported file name: Fyllo_Agona_<όνομα>_<ΕΕΕΕ-ΜΜ-ΗΗ>.csv
  var base = String(fileName || "").replace(/\.[^.]+$/, "");
  var dm = base.match(/(\d{4}-\d{2}-\d{2})/);
  var savedAt = dm ? new Date(dm[1] + "T12:00:00").toISOString() : new Date().toISOString();
  var name = base.replace(/^Fyllo_Agona_?/i, "").replace(/_?\d{4}-\d{2}-\d{2}.*$/, "").replace(/_+/g, " ").trim() || base || "Εισαγόμενος αγώνας";
  var hasWeights = Object.keys(weights).some(function(k){ return weights[k] !== ""; });
  var draw = {
    id: uid(), name: name, savedAt: savedAt, mode: state.mode, teams: [], imported: true,
    numSectors: caps.length, flatAssignments: flat.sort(function(a,b){ return a.position - b.position; }),
    sectorCapacities: caps, weights: weights,
    rankings: hasWeights ? regionalRankRound(flat, caps, weights) : null, teamRankings: null,
    roundAbsent: {}, rounds: null, currentRound: 0, absentAthletes: []
  };
  state.savedDraws.push(draw);
  storageSet(SAVED_DRAWS_KEY, JSON.stringify(state.savedDraws));
  state.importMsg = "✓ Εισήχθη «" + name + "» · " + flat.length + " αθλητές σε " + caps.length + " τομείς" + (hasWeights ? " · με βάρη" : "");
  render();
}

function bulkImport(){
  var textarea = document.getElementById("bulkText");
  var text = textarea ? textarea.value : "";
  var rawLines = text.split("\n").map(function(l){ return l.trim(); });
  var additions = [];
  var currentClub = null;
  rawLines.forEach(function(line){
    if (!line) return;
    if (/[,\t;]/.test(line)) {
      var parts = line.split(/\t|,|;/).map(function(p){ return p.trim(); }).filter(Boolean);
      if (parts.length >= 2) { additions.push({ name: parts[0], club: parts[1], sponsor: parts[2] || "" }); currentClub = null; return; }
    }
    var headerMatch = line.match(/^(.+?)\s*\(\s*\d+\s*\)\s*$/);
    if (headerMatch) { currentClub = headerMatch[1].trim(); return; }
    if (currentClub) {
      var dashSplit = line.split(/\s[–—-]\s*/);
      var name = dashSplit[0].trim();
      var sponsor = dashSplit.slice(1).join(" ").trim();
      if (name) additions.push({ name: name, club: currentClub, sponsor: sponsor });
      return;
    }
    currentClub = line;
  });
  if (additions.length === 0){ state.error = "Δεν βρέθηκαν έγκυρες γραμμές (μορφή: Όνομα, Σύλλογος[, Χορηγός] ή σύλλογος από πάνω και ένα όνομα ανά γραμμή)."; render(); return; }
  state.error = "";
  additions.forEach(function(a){
    var c = state.clubs.find(function(cl){ return normalizeClubName(cl.name) === normalizeClubName(a.club); });
    if (!c){
      var fromLib = state.library.find(function(l){ return normalizeClubName(l.name) === normalizeClubName(a.club); });
      c = { id: uid(), name: a.club, color: CLUB_COLORS[state.clubs.length % CLUB_COLORS.length], logo: fromLib ? fromLib.logo : null, athletes: [] };
      state.clubs.push(c);
    }
    // Skip if this exact athlete (same normalized name) is already in this
    // club — guards against accidentally importing the same list twice.
    var alreadyThere = c.athletes.some(function(existing){ return normalizeClubName(existing.name) === normalizeClubName(a.name); });
    if (!alreadyThere) c.athletes.push({ id: uid(), name: a.name, sponsor: a.sponsor || "" });
  });
  var uniqueClubs = Array.from(new Set(additions.map(function(a){ return a.club; })));
  uniqueClubs.forEach(function(clubName){
    if (!state.library.some(function(l){ return normalizeClubName(l.name) === normalizeClubName(clubName); })) upsertLibrary(clubName, null);
  });
  if (textarea) textarea.value = "";
  persistRoster();
  render();
}

function commitNumSectors(){
  var input = document.getElementById("numSectorsInput");
  var n = Math.max(1, parseInt(input.value) || 1);
  state.numSectors = n;
  input.value = String(n);
}
function commitNumSectorsAndRender(){ commitNumSectors(); render(); }

// Recreates a draw that already happened (e.g. an official one that got
// lost before saving) from pasted text: sector headers ("Τομέας Α") each
// followed by one athlete per line, in the exact order they were drawn.
function importManualDraw(){
  var textarea = document.getElementById("manualDrawText");
  var text = textarea ? textarea.value : "";
  var lines = text.split("\n").map(function(l){ return l.trim(); });
  var sectors = [];
  var current = null;
  lines.forEach(function(line){
    if (!line) return;
    var isHeader = (/^Τομέας\s+.+$/i.test(line) || /^[Α-ΩΆ-Ώα-ω]{1,3}$/.test(line)) && !/[,\t;]/.test(line);
    if (isHeader) { current = { entries: [] }; sectors.push(current); return; }
    if (!current) { current = { entries: [] }; sectors.push(current); }
    var parts = line.split(/\t|,|;/).map(function(p){ return p.trim(); }).filter(Boolean);
    if (parts.length >= 2) current.entries.push({ name: parts[0], club: parts[1], sponsor: parts[2] || "" });
    else if (parts.length === 1) current.entries.push({ name: parts[0], club: "", sponsor: "" });
  });

  var nonEmptySectors = sectors.filter(function(s){ return s.entries.length > 0; });
  if (nonEmptySectors.length === 0){
    state.error = "Δεν βρέθηκαν έγκυρες γραμμές. Μορφή: 'Τομέας Α' και μετά 'Όνομα, Σύλλογος[, Χορηγός]' ανά γραμμή, ανά τομέα.";
    render(); return;
  }
  state.error = "";

  var capacities = nonEmptySectors.map(function(s){ return s.entries.length; });
  var sectorOffsets = [];
  (function(){ var running=0; capacities.forEach(function(c){ sectorOffsets.push(running); running+=c; }); })();

  var flat = [];
  nonEmptySectors.forEach(function(s, sIdx){
    s.entries.forEach(function(entry, localIdx){
      var c = state.clubs.find(function(cl){ return normalizeClubName(cl.name) === normalizeClubName(entry.club); });
      if (!c){
        var fromLib = state.library.find(function(l){ return normalizeClubName(l.name) === normalizeClubName(entry.club); });
        c = { id: uid(), name: entry.club || "Άγνωστος", color: CLUB_COLORS[state.clubs.length % CLUB_COLORS.length], logo: fromLib ? fromLib.logo : null, athletes: [] };
        state.clubs.push(c);
      }
      var existing = c.athletes.find(function(x){ return normalizeClubName(x.name) === normalizeClubName(entry.name); });
      var entryAthlete = existing ? Object.assign({}, existing, { sponsor: entry.sponsor || existing.sponsor || "" })
                                  : { id: uid(), name: entry.name, sponsor: entry.sponsor };
      flat.push(makeFlatEntry(entryAthlete, c, sIdx, sectorOffsets[sIdx] + localIdx + 1));
    });
  });

  state.numSectors = nonEmptySectors.length;
  state.sectorCapacities = capacities;
  state.flatAssignments = flat;
  state.revealedCount = flat.length;
  state.weights = {};
  state.rankings = null;
  state.teams = state.mode === "panhellenic" ? buildTeams(flat) : [];
  if (state.mode === "panhellenic") tagPanFlags(flat, state.teams);
  state.rounds = null;
  state.roundAbsent = {};
  state.teamRankings = null;
  state.teamStandings = [];
  state.stage = "result";
  state.showManualImport = false;
  persistRoster();
  render();
}

function runDraw(){
  var input = document.getElementById("numSectorsInput");
  if (input) commitNumSectors();
  if (!canDraw()) return;
  if (state.mode === "friendly") return runFriendlyDraw();
  if (state.mode === "panhellenic") return runPanhellenicDraw();

  var total = totalAthletes();
  var fixedSize = parseInt(state.fixedSectorSizeText, 10);
  var capacities;
  var technicalPicks = [];
  var regularWorkingClubs;
  var blockSize;

  if (fixedSize > 0) {
    var regularCount = state.numSectors - 1;
    var technicalCapacity = total - fixedSize * regularCount;
    if (technicalCapacity < 0) {
      state.error = "Με σταθερό μέγεθος τομέα " + fixedSize + ", δεν χωράνε " + total + " αθλητές σε " + state.numSectors + " τομείς — αύξησε το μέγεθος τομέα ή μείωσε τον αριθμό τομέων.";
      render(); return;
    }
    capacities = new Array(regularCount).fill(fixedSize).concat([technicalCapacity]);
    blockSize = regularCount;

    // Pure lottery for the technical sector: every athlete, from every
    // club, has exactly the same chance — not just clubs big enough to
    // have a full block in the regular-sector phase below.
    var allAthletes = [];
    activeClubs().forEach(function(c){ c.athletes.forEach(function(a){ allAthletes.push({athlete:a, club:c}); }); });
    technicalPicks = shuffle(allAthletes).slice(0, technicalCapacity);
    var technicalIds = {};
    technicalPicks.forEach(function(p){ technicalIds[p.athlete.id] = true; });

    regularWorkingClubs = shuffle(activeClubs().map(function(c){
      return { id:c.id, name:c.name, color:c.color, logo:c.logo,
        remaining: c.athletes.filter(function(a){ return !technicalIds[a.id]; }).map(function(a){ return {id:a.id, name:a.name, sponsor:a.sponsor, participation:a.participation}; }) };
    }));
  } else {
    capacities = computeCapacities(total, state.numSectors);
    if (capacities.length === 0 || capacities[capacities.length-1] < 1){
      state.error = "Πολλοί τομείς σε σχέση με τον αριθμό αθλητών — μείωσε τον αριθμό τομέων.";
      render(); return;
    }
    blockSize = state.numSectors;
    regularWorkingClubs = shuffle(activeClubs().map(function(c){
      return { id:c.id, name:c.name, color:c.color, logo:c.logo, remaining: c.athletes.map(function(a){ return {id:a.id, name:a.name, sponsor:a.sponsor, participation:a.participation}; }) };
    }));
  }
  state.error = "";
  var numSectors = state.numSectors;

  // Split each club's remaining athletes into fixed entry-order blocks of
  // size blockSize (plus one smaller leftover block if it doesn't divide
  // evenly) — a block is exactly what must never repeat a sector internally.
  var fullBlocks = [];
  var remainderQueue = [];
  regularWorkingClubs.forEach(function(c){
    var nFull = Math.floor(c.remaining.length / blockSize);
    for (var b = 0; b < nFull; b++) {
      fullBlocks.push({ club: c, block: c.remaining.slice(b*blockSize, (b+1)*blockSize) });
    }
    var rest = c.remaining.slice(nFull*blockSize);
    if (rest.length > 0) remainderQueue.push({ club: c, block: rest });
  });

  // Full blocks necessarily touch every currently-open (regular) sector, so
  // whichever is processed first would otherwise always be the same
  // (biggest) club — randomizing their order spreads that out.
  fullBlocks = shuffle(fullBlocks);
  // Remainder blocks are always smaller than blockSize, so processing the
  // biggest one first keeps sectors closing in sync without that concern.
  remainderQueue.sort(function(a,b){ return b.block.length - a.block.length; });

  var numRegularSectors = fixedSize > 0 ? numSectors - 1 : numSectors;
  var filled = new Array(numSectors).fill(0);
  var groups = [];

  function assignBlock(club, block){
    var open = [];
    for (var s = 0; s < numRegularSectors; s++) if (filled[s] < capacities[s]) open.push(s);
    if (open.length === 0) return; // shouldn't happen: total always equals capacity sum

    var distinctCount = Math.min(block.length, open.length);
    // Take the sectors with the most room left (random among equals). Blocks
    // arrive largest-first, so this greedy choice always leaves room for the
    // blocks still to come — picking open sectors purely at random could fill
    // some sectors early and force two athletes of the same block (πεντάδα)
    // into one sector.
    var byRoom = shuffle(open).sort(function(a,b){ return (capacities[b]-filled[b]) - (capacities[a]-filled[a]); });
    var distinctSectors = shuffle(byRoom.slice(0, distinctCount));
    var group = [];

    for (var i = 0; i < distinctCount; i++) {
      var s2 = distinctSectors[i];
      filled[s2] += 1;
      group.push({ athlete: block[i], club: club, sector: s2 });
    }
    // Rare overflow (only when sector capacities are very unevenly sized):
    // spread any leftover block members onto whichever sectors still have
    // the most room left, so nobody is ever dropped.
    for (var i2 = distinctCount; i2 < block.length; i2++) {
      var stillOpen = [];
      for (var s3 = 0; s3 < numRegularSectors; s3++) if (filled[s3] < capacities[s3]) stillOpen.push(s3);
      if (stillOpen.length === 0) break;
      stillOpen.sort(function(a,b){ return filled[a]/capacities[a] - filled[b]/capacities[b]; });
      var s4 = stillOpen[0];
      filled[s4] += 1;
      group.push({ athlete: block[i2], club: club, sector: s4 });
    }
    groups.push(group);
  }

  fullBlocks.forEach(function(fb){ assignBlock(fb.club, fb.block); });
  remainderQueue.forEach(function(rq){ assignBlock(rq.club, rq.block); });

  // Place the technical-sector lottery winners directly into the last
  // sector — their membership was already decided fairly above.
  if (fixedSize > 0 && technicalPicks.length > 0) {
    var lastIdx = numSectors - 1;
    var techGroup = technicalPicks.map(function(p){
      filled[lastIdx] += 1;
      return { athlete: p.athlete, club: p.club, sector: lastIdx };
    });
    groups.push(techGroup);
  }

  var sectorOffsets = [];
  (function(){
    var running = 0;
    for (var i=0;i<capacities.length;i++){ sectorOffsets.push(running); running += capacities[i]; }
  })();

  // Within each sector, arrange seats so two athletes from the same club
  // never sit in consecutive positions whenever that's mathematically
  // possible — what people actually see as "next to each other" at the
  // venue, distinct from just "same sector" (which is fine).
  var arrangeNoAdjacentSameClub = arrangeSeatsNoAdjacentSameClub;

  var allMembers = [].concat.apply([], groups);
  var bySector = {};
  allMembers.forEach(function(g){ (bySector[g.sector] = bySector[g.sector] || []).push(g); });

  var flat = [];
  Object.keys(bySector).forEach(function(key){
    var sIdx = parseInt(key, 10);
    var arranged = arrangeNoAdjacentSameClub(bySector[sIdx]);
    arranged.forEach(function(g, localIndex){
      flat.push(makeFlatEntry(g.athlete, g.club, sIdx, sectorOffsets[sIdx] + localIndex + 1));
    });
  });
  // The seat assignment above is deterministic per sector; shuffle the array
  // order itself (positions stay attached) purely so the reveal animation
  // doesn't play out sector-by-sector.
  flat = shuffle(flat);
  startReveal(flat, capacities);
}

// Φιλικοί: every present athlete shuffled into one line and poured into the
// sectors in order — no club, block, adjacency or technical-sector rules.
/* ---------- Φιλικοί: αγώνας ζευγαριών ---------- */
// A pair takes ONE seat; its two athletes may come from different clubs
// (or ΟΠΕΝ) and keep their own sponsors. Athletes without a partner fish alone.
function persistPairs(){ storageSet(PAIRS_KEY, JSON.stringify(state.pairCfg)); }
function pairsActive(){ return state.mode === "friendly" && state.pairCfg && state.pairCfg.enabled; }
function findAthlete(id){
  for (var i = 0; i < state.clubs.length; i++){
    var a = state.clubs[i].athletes.find(function(x){ return x.id === id; });
    if (a) return { athlete: a, club: state.clubs[i] };
  }
  return null;
}
function validPairs(){
  return (state.pairCfg.list || []).filter(function(p){ return findAthlete(p.a) && findAthlete(p.b); });
}
function pairedIds(){
  var m = {};
  validPairs().forEach(function(p){ m[p.a] = p.id; m[p.b] = p.id; });
  return m;
}
function setPairsEnabled(on){ state.pairCfg.enabled = !!on; persistPairs(); render(); }
function setPairWeigh(v){ state.pairCfg.weigh = v === "each" ? "each" : "pair"; persistPairs(); render(); }
function addPair(){
  var a = document.getElementById("pairA"), b = document.getElementById("pairB");
  var ia = a ? a.value : "", ib = b ? b.value : "";
  if (!ia || !ib || ia === ib) return;
  state.pairCfg.list = validPairs();
  state.pairCfg.list.push({ id: uid(), a: ia, b: ib });
  persistPairs(); render();
}
function removePair(id){
  state.pairCfg.list = (state.pairCfg.list || []).filter(function(p){ return p.id !== id; });
  persistPairs(); render();
}
function pairEntry(m1, m2){
  var members = [m1, m2].map(function(m){ return { id: m.athlete.id, name: m.athlete.name, clubName: m.club.name, sponsor: m.athlete.sponsor || "", logo: m.club.logo || null, color: m.club.color }; });
  var clubs = [], sponsors = [];
  members.forEach(function(m){ if (clubs.indexOf(m.clubName) === -1) clubs.push(m.clubName); if (m.sponsor && sponsors.indexOf(m.sponsor) === -1) sponsors.push(m.sponsor); });
  return {
    athlete: { id: "pair-" + m1.athlete.id + "-" + m2.athlete.id, name: members[0].name + " / " + members[1].name, sponsor: sponsors.join(" / ") },
    club: { id: m1.club.id, name: clubs.join(" / "), color: m1.club.color, logo: m1.club.logo },
    members: members
  };
}
// Entries of a friendly race: pairs (or the remaining partner if one is
// absent) plus everyone without a partner.
function friendlyEntries(){
  var entries = [];
  var inPair = pairsActive() ? pairedIds() : {};
  if (pairsActive()){
    validPairs().forEach(function(p){
      var A = findAthlete(p.a), B = findAthlete(p.b);
      if (!modeClubs().some(function(c){ return c.id === A.club.id; }) || !modeClubs().some(function(c){ return c.id === B.club.id; })) return;
      var here = [A, B].filter(function(x){ return !x.athlete.absent; });
      if (here.length === 2) entries.push(pairEntry(A, B));
      else if (here.length === 1) entries.push({ athlete: here[0].athlete, club: here[0].club });
    });
  }
  activeClubs().forEach(function(c){ c.athletes.forEach(function(a){ if (!inPair[a.id]) entries.push({ athlete: a, club: c }); }); });
  return entries;
}
function setMemberWeight(entryId, idx, value){
  var mw = state.memberWeights[entryId] = state.memberWeights[entryId] || ["", ""];
  mw[idx] = String(value).trim();
  var total = parseWeight(mw[0]) + parseWeight(mw[1]);
  state.weights[entryId] = (mw[0] === "" && mw[1] === "") ? "" : String(total);
  state.rankings = null; state.teamRankings = null;
  render();
}
function memberWeightText(a){
  var mw = a && a.members && state.memberWeights && state.memberWeights[a.athleteId];
  if (!mw) return "";
  return parseWeight(mw[0]) + " + " + parseWeight(mw[1]);
}

function runFriendlyDraw(){
  var entries = friendlyEntries();
  var total = entries.length;
  var capacities = computeCapacities(total, state.numSectors);
  if (capacities.length === 0 || capacities[capacities.length-1] < 1){
    state.error = "Πολλοί τομείς σε σχέση με τον αριθμό αθλητών — μείωσε τον αριθμό τομέων.";
    render(); return;
  }
  state.error = "";
  var all = shuffle(entries);
  var flat = [];
  var pos = 0;
  capacities.forEach(function(cap, sIdx){
    for (var i = 0; i < cap; i++){
      var g = all[pos];
      pos++;
      var fe = makeFlatEntry(g.athlete, g.club, sIdx, pos);
      if (g.members) fe.members = g.members;
      flat.push(fe);
    }
  });
  state.drawPairWeigh = state.pairCfg.weigh;
  startReveal(shuffle(flat), capacities);
}

// Πανελλήνιο: always 5 sectors. Each team's five goes one per sector, so
// every sector holds exactly one athlete of every team. Athletes who compete
// only individually (plus any club athletes beyond the team) then fill the
// sectors so that every sector holds the same number of individual
// competitors (e.g. 35 → 7 per sector) — both rankings run 1..N everywhere,
// however many athletes physically sit in the sector.
function runPanhellenicDraw(){
  var N = Math.max(2, parseInt(state.numSectors, 10) || 5);
  state.numSectors = N;
  var tooBig = activeClubs().filter(function(c){ return teamMemberIdsForClub(findClub(c.id)).length > N; });
  if (tooBig.length){
    state.error = "Ομάδα μεγαλύτερη από τους τομείς (" + N + "): " + tooBig.map(function(c){ return c.name; }).join(", ") + ". Κάθε μέλος ομάδας πρέπει να πάει σε διαφορετικό τομέα — αύξησε τους τομείς ή μείωσε το μέγεθος ομάδας.";
    render(); return;
  }
  var counts = panCounts();
  if (counts.orphans.length){
    state.error = "«Μόνο ομαδικά» αλλά εκτός ομάδας (η ομάδα είναι ήδη πλήρης): " + counts.orphans.join(", ") + ". Άλλαξε τη συμμετοχή τους ή το μέγεθος ομάδας.";
    render(); return;
  }
  // Individual field per sector (άρθρο 27): equal sectors, and whatever is
  // left makes the last sector technical (e.g. 39 in 5 → 8·8·8·8·7).
  var targets = computeCapacities(counts.individual, N);
  if (!targets.length || targets[N-1] < 1){
    state.error = "Πολύ λίγοι αθλητές ατομικού (" + counts.individual + ") για " + N + " τομείς.";
    render(); return;
  }

  var teamEntries = [], extras = [];
  activeClubs().forEach(function(c){
    var full = findClub(c.id);
    var teamIds = teamMemberIdsForClub(full);
    var team = [];
    c.athletes.forEach(function(a){
      if (teamIds.indexOf(a.id) !== -1) team.push({ athlete: a, club: c });
      else extras.push({ athlete: a, club: c }); // participation is never "team" here (orphans rejected above)
    });
    if (team.length) teamEntries.push(team);
  });

  // Quick feasibility check: every team as large as the sector count puts one
  // athlete in every sector, so a sector can't hold fewer individual
  // competitors than the number of such teams without a «μόνο ομαδικά» member.
  var minPerSector = teamEntries.filter(function(t){
    return t.length >= N && !t.some(function(g){ return participationOf(g.athlete) === "team"; });
  }).length;
  if (targets[N-1] < minPerSector){
    state.error = "Με " + counts.individual + " ατομικούς σε " + N + " τομείς ο τεχνητός τομέας " + sectorLabel(N-1) + " θα είχε " + targets[N-1] +
      " αθλητές ατομικού, αλλά οι " + minPerSector + " πλήρεις ομάδες βάζουν υποχρεωτικά από έναν εκεί. Ο τεχνητός τομέας ατομικού δημιουργείται όταν μια ομάδα έχει λιγότερα μέλη (π.χ. ομάδα των 4) — έλεγξε τον αριθμό ατομικού ή τις ομάδες.";
    render(); return;
  }
  var ROUNDS = 3;
  var allPlaced = null;
  var t0 = Date.now();
  for (var tries = 0; tries < 90 && !allPlaced && Date.now() - t0 < 8000; tries++){
    // First strict (nobody repeats a sector); if that keeps failing — or takes
    // too long — let individual-only athletes repeat where unavoidable.
    var strict = tries < 30 && Date.now() - t0 < 2500;
    var used = {}, got = [];
    for (var r = 0; r < ROUNDS; r++){
      var placed = panPlaceRound(teamEntries, extras, targets, used, strict);
      if (!placed){ got = null; break; }
      placed.forEach(function(members, sIdx){
        members.forEach(function(g){ (used[g.athlete.id] = used[g.athlete.id] || {})[sIdx] = true; });
      });
      got.push(placed);
    }
    if (got) allPlaced = got;
  }
  if (!allPlaced){
    state.error = "Δεν βρέθηκε κλήρωση 3 αγωνιστικών με αλλαγή τομέα για όλους και ισοκατανομή. Έλεγξε τις συμμετοχές («μόνο ομαδικά» / «μόνο ατομικά»).";
    render(); return;
  }
  state.error = "";

  var rounds = allPlaced.map(function(placed){
    var caps = placed.map(function(p){ return p.length; });
    var flat = [], running = 0;
    placed.forEach(function(members, sIdx){
      arrangeSeatsNoAdjacentSameClub(members).forEach(function(g, i){
        flat.push(makeFlatEntry(g.athlete, g.club, sIdx, running + i + 1));
      });
      running += members.length;
    });
    return { flatAssignments: shuffle(flat), sectorCapacities: caps, weights: {}, rankings: null, teamRankings: null, roundAbsent: {} };
  });
  var teams = buildTeams(rounds[0].flatAssignments);
  rounds.forEach(function(r){ tagPanFlags(r.flatAssignments, teams); });
  state.rounds = rounds;
  state.currentRound = 0;
  startReveal(rounds[0].flatAssignments, rounds[0].sectorCapacities);
}

function startReveal(flat, capacities){
  if (state.mode !== "panhellenic") state.rounds = null;
  state.sectorCapacities = capacities;
  state.flatAssignments = flat;
  state.revealedCount = 0;
  state.weights = isChampionship() ? state.rounds[state.currentRound].weights : {};
  state.memberWeights = {};
  state.roundAbsent = isChampionship() ? state.rounds[state.currentRound].roundAbsent : {};
  state.rankings = null;
  state.teams = state.mode === "panhellenic" ? buildTeams(flat) : [];
  if (state.mode === "panhellenic") tagPanFlags(flat, state.teams);
  state.teamRankings = null;
  state.teamStandings = [];
  state.stage = "drawing";
  render();

  clearInterval(revealTimer);
  revealTimer = setInterval(function(){
    state.revealedCount++;
    if (state.revealedCount >= state.flatAssignments.length){
      clearInterval(revealTimer);
      state.stage = "result";
    }
    render();
  }, 420);
}

function newDrawSameClubs(){
  state.rounds = null;
  state.roundAbsent = {};
  state.stage = "setup";
  state.flatAssignments = [];
  state.revealedCount = 0;
  state.rankings = null;
  render();
}

function resetAll(){
  confirmOrRun("reset-all", function(){
    state.clubs.forEach(function(c){ c.athletes = []; });
    state.rounds = null;
    state.roundAbsent = {};
    state.flatAssignments = [];
    state.revealedCount = 0;
    state.weights = {};
    state.rankings = null;
    state.stage = "setup";
    state.error = "";
  });
}

/* ---------- scoring ---------- */
function computeRankings(){
  if (state.mode === "panhellenic"){
    var rk = panRankRound(state.flatAssignments, state.sectorCapacities, state.weights, state.roundAbsent);
    state.rankings = rk.ind;
    state.teamRankings = rk.team;
    render();
    return;
  }
  state.rankings = regionalRankRound(state.flatAssignments, state.sectorCapacities, state.weights);
  render();
}

// Περιφερειακά / Φιλικά: sector ranks for one race, with the technical-sector
// borrowing of Παράδειγμα 2.
function regionalRankRound(flat, caps, weights){
  var numSectors = caps.length;
  var result = {};
  var isTechnical = caps.length > 0 && caps[caps.length-1] !== caps[0] && caps[caps.length-1] > 0;
  var lastIdx = numSectors - 1;
  var diff = isTechnical ? caps[0] - caps[lastIdx] : 0;

  function toWeighted(sectorIdx){
    return flat.filter(function(a){ return a.sector === sectorIdx; })
      .map(function(a){ return { athleteId: a.athleteId, weight: parseWeight(weights[a.athleteId]) }; });
  }

  for (var s=0; s<numSectors; s++){
    if (isTechnical && s === lastIdx) continue;
    Object.assign(result, rankGroupByWeight(toWeighted(s)));
  }

  if (isTechnical){
    var secondToLastIdx = lastIdx - 1;
    var sectorOffsets = [];
    (function(){ var running=0; for (var i=0;i<caps.length;i++){ sectorOffsets.push(running); running+=caps[i]; } })();
    var secondToLastCapacity = caps[secondToLastIdx];
    var secondToLastAthletes = flat.filter(function(a){ return a.sector === secondToLastIdx; });
    // Borrow whoever physically sits in the last `diff` positions of the
    // second-to-last sector (bordering the technical sector) — fixed by the
    // draw itself, not by weight.
    var borrowed = secondToLastAthletes
      .filter(function(a){ return (a.position - sectorOffsets[secondToLastIdx]) > (secondToLastCapacity - diff); })
      .map(function(a){ return { athleteId: a.athleteId, weight: parseWeight(weights[a.athleteId]) }; });
    var technicalReal = toWeighted(lastIdx);
    var combined = technicalReal.concat(borrowed.map(function(b){ return { athleteId: "__borrowed__"+b.athleteId, weight: b.weight }; }));
    var combinedRanks = rankGroupByWeight(combined);
    technicalReal.forEach(function(a){ result[a.athleteId] = combinedRanks[a.athleteId]; });
  }

  return result;
}

function openFinalRanking(){
  if (!state.rankings) return;
  var nameInput = document.getElementById("saveNameInput");
  if (nameInput) state.saveNameInput = nameInput.value;
  state.finalStandings = computeFinalStandings();
  state.stage = "finalRanking";
  render();
}
function computeFinalStandings(){
  var rankings = state.rankings, weights = state.weights;
  var excludeTeamOnly = state.mode === "panhellenic";
  var individualPool = state.flatAssignments.filter(function(a){ return !(excludeTeamOnly && a.inIndividual === false); });
  var withPlace = individualRows(state.flatAssignments, state.sectorCapacities, weights, rankings, excludeTeamOnly, state.roundAbsent);

  // Athletes marked "Απών" never entered the draw, so they carry no
  // sector/position — appended here, all sharing one score: the worst
  // real score in the competition, plus one.
  var allScores = individualPool.map(function(a){ return rankings[a.athleteId] || 0; });
  var maxScore = allScores.length > 0 ? Math.max.apply(null, allScores) : 0;
  var absentScore = maxScore + 1;
  var absentPlace = withPlace.length + 1;
  // Πανελλήνιο: athletes marked absent before the draw are simply not
  // taking part; absences on the day are marked per round instead.
  if (state.mode !== "panhellenic") modeClubs().forEach(function(c){
    c.athletes.filter(function(a){ return a.absent; }).forEach(function(a){
      withPlace.push({
        athleteId: a.id, athleteName: a.name, sponsor: a.sponsor || "",
        clubName: c.name, color: c.color, logo: c.logo,
        sector: null, position: null, localPosition: null,
        score: absentScore, weight: 0, place: absentPlace
      });
    });
  });

  return withPlace;
}

// Ομαδική κατάταξη (Πανελλήνιο): sum of the team members' sector scores
// (Β/Π) — lower is better; ties broken by higher total weight. Teams with
// fewer present members than their team size are listed after full teams.

  if (!state.rankings) return;

  state.teamStandings = rows;
  state.stage = "teamRanking";
  render();
}

// Exports the official-style Φύλλο Αγώνα as CSV (opens directly in Excel) —
// no external library needed, so downloads work reliably in any real browser.
// ΘΕΣΗ = sector letter + continuous position (e.g. "D24" = sector Δ, position 24).
function csvCell(v){
  v = v === null || v === undefined ? "" : String(v);
  if (/[";\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function downloadCsv(filename, header, rows){
  var lines = [header.map(csvCell).join(";")];
  rows.forEach(function(row){ lines.push(row.map(csvCell).join(";")); });
  var csv = "\uFEFF" + lines.join("\r\n"); // BOM so Excel reads Greek/UTF-8 correctly
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
