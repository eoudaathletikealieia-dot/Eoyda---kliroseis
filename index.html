      [A, B].map(function(X){ return '<div style="display:flex; align-items:center; gap:6px;">'+clubMark(X.club.logo, X.club.color, 14)+'<span>'+esc(X.athlete.name)+' <span style="color:#8A93A0; font-size:11px;">· '+esc(X.club.name)+'</span></span></div>'; }).join('') + '</div>';
    html += '<button class="icon-btn" onclick="removePair('+jsStr(p.id)+')" title="Διάλυση ζευγαριού">✕</button></div>';
  });
  var free = all.filter(function(x){ return !inPair[x.a.id]; });
  function sel(id){
    return '<select id="'+id+'" class="input" style="flex:1; font-size:12.5px; padding:6px;"><option value="">— αθλητής —</option>' +
      free.map(function(x){ return '<option value="'+esc(x.a.id)+'">'+esc(x.a.name)+' · '+esc(x.c.name)+'</option>'; }).join('') + '</select>';
  }
  html += '<div style="display:flex; gap:6px; align-items:center; margin-top:8px;">'+sel("pairA")+'<span style="color:#8A93A0;">+</span>'+sel("pairB")+'<button class="btn-primary-sm" onclick="addPair()" title="Νέο ζευγάρι">＋</button></div>';
  html += '<div style="font-size:11.5px; color:#8A93A0; margin-top:6px;">'+pairs.length+' ζευγάρια · '+free.length+' αθλητές χωρίς ταίρι (αγωνίζονται μόνοι τους, ο καθένας σε δική του θέση)</div>';
  return html + '</div>';
}

    html += '<div class="club-card">';
    html += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">';

      html += '<button class="icon-btn-armed" onclick="removeClub('+jsStr(club.id)+')" style="margin-right:6px;">Οριστική διαγραφή</button>';

      html += '<button class="icon-btn" onclick="removeClub('+jsStr(club.id)+')">✕ Διαγραφή συλλόγου</button>';
    }

    club.athletes.forEach(function(a){
      var armed = state.pendingDelete === "athlete-"+a.id;
      html += '<div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #F0EBDD;">';
      html += '<span style="flex:1; font-size:13.5px;">'+esc(a.name)+'</span>';
      if (armed){
        html += '<button class="icon-btn-armed" onclick="removeAthlete('+jsStr(club.id)+', '+jsStr(a.id)+')" style="margin-right:6px;">Οριστική διαγραφή</button>';
        html += '<button class="btn-ghost-sm" onclick="state.pendingDelete=null; render();">Άκυρο</button>';
      } else {
        html += '<button class="icon-btn" onclick="removeAthlete('+jsStr(club.id)+', '+jsStr(a.id)+')">✕</button>';
      }
      html += '</div>';
    });
    html += '</div>';
  });

  var resetArmed = state.pendingDelete === "reset-all";
  html += '<div style="margin-top:20px; text-align:center;">';

    html += '<button class="btn-ghost" onclick="resetAll()">🗑 Καθαρισμός αθλητών</button>';
  }
  html += '</div>';

  return html;
}

    html += '</div>';

    html += '<button class="'+(armed?"icon-btn-armed":"icon-btn")+'" onclick="deleteSavedDraw('+jsStr(d.id)+')">'+(armed?"Σίγουρα;":"✕")+'</button>';
    html += '</div></div>';
  });
  if (state.mode === "regional" && list.length >= 2){
    var nSel = list.filter(function(d){ return state.seriesSel[d.id]; }).length;
    html += '<div style="position:sticky; bottom:0; background:#F6F2E7; padding:12px 0 6px; text-align:center;">';
    html += '<div style="font-size:11.5px; color:#8A93A0; margin-bottom:6px;">Τσέκαρε 2 ή περισσότερους αγώνες για συγκεντρωτική κατάταξη</div>';

  }
  return html;
}

// Club mark: logo, or a coloured dot when the club has no logo.
function clubMark(logo, color, size){
  return logo ? '<img src="'+logo+'" style="width:'+size+'px;height:'+size+'px;border-radius:50%;object-fit:cover;flex-shrink:0;" />'
    : '<span style="width:'+Math.round(size*0.6)+'px;height:'+Math.round(size*0.6)+'px;border-radius:50%;background:'+(color||"#8A93A0")+';display:inline-block;flex-shrink:0;"></span>';
}
function athleteCell(r){
  var h = '<div style="flex:1; min-width:110px;"><div style="font-size:13.5px; color:'+INK+'; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(r.athleteName)+'</div>';
  h += '<div style="font-size:11px; color:#8A93A0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(r.clubName || "")+'</div>';
  if (r.sponsor) h += '<div style="font-size:10.5px; color:#B8862F; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(r.sponsor)+'</div>';
  return h + '</div>';
}
function raceCell(label, x){
  if (!x) return '<div style="text-align:center; min-width:40px;"><div style="font-size:9.5px; color:#8A93A0;">'+label+'</div><div style="font-size:12.5px; color:#C7C0AC;">—</div></div>';
  var abs = x.missing || x.roundAbsent;
  return '<div style="text-align:center; min-width:40px;"><div style="font-size:9.5px; color:#8A93A0;">'+label+'</div>' +
    '<div style="font-size:12.5px; font-weight:bold; color:'+(abs?"#A33":NAVY)+';">'+x.score+'</div>' +
    '<div style="font-size:9.5px; color:'+(abs?"#A33":"#8A93A0")+';">'+(abs?"απ":x.weight+'γ')+'</div></div>';
}

function renderQuota(){
  var Q = computeQuota();
  var html = '<div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">';
  html += '<button class="btn-link" onclick="goSavedDraws()">← Πίσω</button>';
  html += '<span style="font-family:Georgia,serif; font-size:16px; color:'+NAVY+';">Κατανομή θέσεων τελικού</span></div>';
  html += '<div class="club-card" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">';
  html += '<label style="font-size:12px; color:#5A6472;">Θέσεις τελικού<br><input class="input" type="text" inputmode="numeric" style="width:80px; margin-top:4px;" value="'+Q.places+'" onblur="setQuotaPlaces(this.value)" onkeydown="if(event.key===\'Enter\'){this.blur();}" /></label>';
  html += '<label style="font-size:12px; color:#5A6472;">Έγκυρη συμμετοχή: ελάχιστοι αγώνες<br><input class="input" type="text" inputmode="numeric" style="width:80px; margin-top:4px;" value="'+state.quota.minRaces+'" onblur="setQuotaMin(this.value)" onkeydown="if(event.key===\'Enter\'){this.blur();}" /></label>';
  html += '</div>';
  html += quotaNoteHtml(Q);
  html += '<div style="background:#fff; border:1px solid #E4DFCF; border-radius:5px; overflow:hidden;">';
  html += '<div style="display:flex; gap:8px; padding:8px 10px; background:'+NAVY+'; color:#fff; font-size:11.5px; font-weight:bold;"><span style="flex:1;">Περιφέρεια</span><span style="width:74px; text-align:center;">Έγκυροι</span><span style="width:54px; text-align:center;">Θέσεις</span></div>';
  if (!Q.rows.length) html += '<div style="padding:14px; color:#8A93A0; font-size:13px;">Δεν υπάρχουν ακόμα περιφέρειες. Όρισε περιφέρεια στους αποθηκευμένους αγώνες ή πρόσθεσε μία χειροκίνητα παρακάτω.</div>';
  Q.rows.forEach(function(r, i){
    var sc = r.locked ? Q_GREEN : Q_ORANGE;
    html += '<div style="display:flex; gap:8px; align-items:center; padding:9px 10px; border-top:'+(i?'1px solid #F0EBDD':'none')+'; border-left:4px solid '+sc+'; background:'+(r.locked?'#F3F9F4':'#FFF9F3')+';">';
    html += '<div style="flex:1; min-width:0;"><div style="font-weight:bold; color:'+NAVY+'; font-size:13.5px;">'+esc(r.region)+'</div>';
    html += '<div style="font-size:10.5px; color:#8A93A0;">'+(r.races ? r.races+' αγώνες στην εφαρμογή · αυτόματα '+r.auto+' έγκυροι' : 'χωρίς αγώνες στην εφαρμογή')+'</div>';
    html += '<div style="font-size:10.5px; font-weight:bold; color:'+sc+';">'+(r.locked ? '🔒 Κλειδωμένη · '+new Date(r.lockedAt).toLocaleDateString("el-GR") : '⏳ Σε εκκρεμότητα')+'</div>';
    html += '<button onclick="'+(r.locked?'unlockQuotaRegion':'lockQuotaRegion')+'('+jsStr(r.region)+')" style="margin-top:4px; border:1px solid '+sc+'; background:#fff; color:'+sc+'; border-radius:10px; padding:1px 9px; font-size:11px; cursor:pointer; font-family:inherit;">'+(r.locked?'🔓 Ξεκλείδωμα':'🔒 Κλείδωμα')+'</button></div>';
    if (r.locked) html += '<div style="width:74px; text-align:center; font-size:16px; font-weight:bold; color:'+Q_GREEN+';" title="Κλειδωμένο">'+r.valid+'</div>';
    else html += '<input class="input" type="text" inputmode="numeric" style="width:74px; text-align:center; padding:6px;" placeholder="'+(r.auto === null ? '0' : r.auto)+'" value="'+(r.manual === null ? '' : r.manual)+'" onblur="setQuotaManual('+jsStr(r.region)+', this.value)" onkeydown="if(event.key===\'Enter\'){this.blur();}" title="Κενό = αυτόματα από τους αγώνες" />';
    html += '<div style="width:54px; text-align:center;"><div style="font-size:18px; font-weight:bold; color:'+NAVY+';">'+r.places+'</div><div style="font-size:9.5px; color:#8A93A0;">'+r.exact.toFixed(2)+(r.bonus?' ↑':'')+'</div></div>';
    if (!r.races && !r.locked) html += '<button class="icon-btn" onclick="removeQuotaRegion('+jsStr(r.region)+')" title="Αφαίρεση">✕</button>';
    html += '</div>';
  });
  html += '<div style="display:flex; gap:8px; padding:9px 10px; border-top:2px solid '+GOLD+'; font-weight:bold; color:'+NAVY+'; font-size:13.5px;"><span style="flex:1;">Σύνολο</span><span style="width:74px; text-align:center;">'+Q.total+'</span><span style="width:54px; text-align:center;">'+Q.rows.reduce(function(s,r){ return s + r.places; }, 0)+'</span></div>';
  html += '</div>';
  html += regionDatalist();
  html += '<div style="display:flex; gap:8px; margin-top:10px;"><input id="newQuotaRegion" list="regionList" class="input" style="flex:1; font-size:13px;" placeholder="Περιφέρεια χωρίς αγώνες στην εφαρμογή" onkeydown="if(event.key===\'Enter\'){addQuotaRegion();}" /><button class="btn-primary-sm" onclick="addQuotaRegion()">＋</button></div>';
  html += '<div style="font-size:11.5px; color:#8A93A0; margin-top:12px; line-height:1.55;">Κάθε περιφέρεια παίρνει θέσεις ανάλογα με τους έγκυρους αθλητές της: θέσεις τελικού × έγκυροι περιφέρειας ÷ σύνολο έγκυρων. Κρατιέται το ακέραιο μέρος, και οι θέσεις που περισσεύουν πάνε στα μεγαλύτερα υπόλοιπα (↑), ώστε το σύνολο να είναι πάντα '+Q.places+'. Οι έγκυροι βγαίνουν αυτόματα από τους αγώνες κάθε περιφέρειας· γράψε αριθμό για να τον αντικαταστήσεις.</div>';
  return html;
}

    html += '<div style="background:#fff; border:1px solid #E4DFCF; border-radius:5px; overflow-x:auto; opacity:0.75;">';

      html += '<div style="display:flex; align-items:center; gap:8px; padding:9px 10px; min-width:'+(215+n*46)+'px; border-top:'+(idx===0?"none":"1px solid #F0EBDD")+';">';

      html += athleteCell(r);

  html += '<button class="btn-secondary" onclick="goSavedDraws()">← Αποθηκευμένες</button>';
  html += '</div>';
  return html;
}

  if (state.champRoundsCounted === 0){
    html += '<div style="color:#8A93A0; font-size:13px; text-align:center; margin:20px 0;">Δεν έχουν περαστεί ακόμα βάρη σε καμία αγωνιστική.</div>';
  }
  function perCell(label, val, sub){
    return '<div style="text-align:center; min-width:34px;"><div style="font-size:9.5px; color:#8A93A0;">'+label+'</div><div style="font-size:12.5px; font-weight:bold; color:'+(val===""?"#C7C0AC":NAVY)+';">'+(val===""?"—":val)+'</div>'+(sub?'<div style="font-size:9px; color:#A33;">'+sub+'</div>':'')+'</div>';
  }
  html += '<div style="background:#fff; border:1px solid #E4DFCF; border-radius:5px; overflow-x:auto;">';
  var list = state.champTab === "team" ? state.champTeam : state.champInd;
  list.forEach(function(r, idx){
    var top3 = r.place <= 3 && state.champRoundsCounted > 0;
    html += '<div style="display:flex; align-items:center; gap:8px; padding:9px 10px; border-top:'+(idx===0?"none":"1px solid #F0EBDD")+'; background:'+(top3?"#FBF6E8":"#fff")+';">';
    html += placeBadge(r.place, 28, top3);
    html += '<div style="flex:1; min-width:0;">';
    if (state.champTab === "team"){
      html += '<div style="font-size:13.5px; font-weight:bold; color:'+NAVY+'; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(r.clubName)+'</div>';
    } else {
      html += athleteCell(r).replace('<div style="flex:1; min-width:110px;">','<div>');
    }
    html += '</div>';
    r.per.forEach(function(x, i){
      if (state.champTab === "team") html += perCell((i+1)+'η', x ? x.place : "");
      else html += raceCell((i+1)+'η', x);
    });
    html += '<div style="text-align:right; min-width:52px; flex-shrink:0;"><div style="font-size:13.5px; font-weight:bold; color:'+NAVY+';">'+(state.champTab==="team"?r.totalPlaces:r.totalScore)+'</div>';
    html += '<div style="font-size:10.5px; color:#8A93A0;">'+(state.champTab==="team"?r.totalPenalty+' Β/Π · ':'')+r.totalWeight+' γρ.</div></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div style="font-size:11px; color:#8A93A0; text-align:center; margin-top:8px; line-height:1.5;">'+(state.champTab==="team"
    ? 'Άθροισμα ημερήσιων θέσεων · ισοβαθμία: σύνολο βαθμών ποινής, μετά σύνολο βάρους'
    : 'Άθροισμα βαθμών ποινής · ισοβαθμία: συνολικό βάρος, μετά καλύτερη ημερήσια θέση')+'</div>';
  html += '<div style="display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;">';
  html += '<button class="btn-gold" onclick="exportChampionshipToExcel()">📊 Export σε Excel</button>';
  html += '<button class="btn-gold" onclick="printPdf(\'championship\')">📄 PDF</button>';
  html += '<button class="btn-secondary" onclick="state.stage=\'result\'; render();">← Αγωνιστικές</button>';
  html += '</div>';
  return html;
}

function renderDraw(){
  var html = '<div style="text-align:center; font-size:13px; color:#5A6472; margin-bottom:16px;">';
  html += state.stage === "drawing"
    ? "Κληρώνονται οι αθλητές… (" + state.revealedCount + "/" + state.flatAssignments.length + ")"
    : "Η κλήρωση ολοκληρώθηκε.";
  html += '</div>';
  if (isChampionship() && state.stage === "result"){
    html += '<div class="round-tabs">';
    state.rounds.forEach(function(r, i){
      html += '<button class="round-tab'+(i===state.currentRound?' active':'')+'" onclick="goRound('+i+')">'+(i+1)+'η Αγωνιστική</button>';
    });
    html += '<button class="round-tab champ" onclick="openChampionship()">🏆 Πρωτάθλημα</button>';
    html += '</div>';
    html += '<div style="text-align:center; font-size:11.5px; color:#8A93A0; margin:-8px 0 14px;">Κάθε αθλητής αλλάζει τομέα σε κάθε αγωνιστική · «Απ» = απών εκείνη τη μέρα (κενή ψαρεύτρα, βαθμός τομέα +1)</div>';
  }

  var byPosition = new Array(state.flatAssignments.length).fill(null);
  state.flatAssignments.forEach(function(a, chronoIndex){ byPosition[a.position-1] = Object.assign({}, a, {chronoIndex: chronoIndex}); });

  var sectorOffsets = [];
  (function(){ var running=0; for (var i=0;i<state.sectorCapacities.length;i++){ sectorOffsets.push(running); running+=state.sectorCapacities[i]; } })();

  html += '<div style="max-width:440px; margin:0 auto;">';
  state.sectorCapacities.forEach(function(cap, sIdx){
    var isPanMode = state.mode === "panhellenic";
    var panTech = isPanMode ? panTechLabel(state.flatAssignments, sIdx, state.sectorCapacities.length) : "";
    var isTechnical = isPanMode
      ? !!panTech
      : (state.sectorCapacities.length>0 && cap !== state.sectorCapacities[0]);
    var start = sectorOffsets[sIdx]+1, end = sectorOffsets[sIdx]+cap;
    html += '<div style="margin-bottom:18px;">';
    html += '<div style="font-family:Georgia,serif; font-size:14px; color:'+NAVY+'; margin-bottom:8px; padding-bottom:4px; border-bottom:2px solid '+GOLD+';">Τομέας '+sectorLabel(sIdx);
    if (isTechnical) html += '<span style="font-size:11px; color:#B8862F; margin-left:6px;">· Τεχνητός'+(isPanMode?' ('+panTech+')':'')+'</span>';
    if (cap === 0) html += '<span style="font-size:11px; color:#8A93A0; margin-left:6px; font-style:italic;">(0 αθλητές αυτή τη φορά)</span>';
    html += '</div>';
    html += '<div style="position:relative; padding-left:4px;">';
    html += '<div style="position:absolute; left:17px; top:4px; bottom:4px; width:2px; background:#E4DFCF;"></div>';
    for (var p=start; p<=end; p++){
      var slot = byPosition[p-1];
      var filled = slot && slot.chronoIndex < state.revealedCount;
      html += '<div style="padding:5px 0;">';
      html += '<div style="display:flex; align-items:center; gap:10px; position:relative;">';
      html += '<div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0;z-index:1;background:'+(filled?NAVY:"#fff")+';border:2px solid '+(filled?GOLD:"#D8D2C0")+';color:'+(filled?"#fff":"#B7BFC9")+';">'+p+'</div>';
      html += '<div style="font-size:13.5px; display:flex; align-items:center; gap:6px; flex:1; min-width:0;">';
      if (filled){
        if (!slot.members){
          if (slot.logo) html += '<img src="'+slot.logo+'" style="width:16px;height:16px;border-radius:50%;object-fit:cover;" />';
          else html += '<span style="width:9px;height:9px;border-radius:50%;background:'+slot.color+';display:inline-block;flex-shrink:0;"></span>';
        }
        if (slot.members){
          // Ζευγάρι: each partner on his own line with his own club logo.
          html += '<span style="display:flex; flex-direction:column; gap:2px; min-width:0; line-height:1.25;">';
          slot.members.forEach(function(m){
            html += '<span style="display:flex; align-items:center; gap:6px; min-width:0;">'+clubMark(m.logo, m.color, 16)+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(m.name)+' <span style="color:#8A93A0; font-size:11px;">· '+esc(m.clubName)+'</span></span></span>';
          });
          html += '</span><span title="Ζευγάρι" style="flex-shrink:0; font-size:10px; color:#B8862F; font-weight:bold;">👥</span>';
        } else {
        html += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(isChampionship() && state.roundAbsent && state.roundAbsent[slot.athleteId] ? 'text-decoration:line-through; opacity:0.55;' : '')+'">'+esc(slot.athleteName)+'</span><span style="color:#8A93A0; font-size:11px; white-space:nowrap;">· '+esc(slot.clubName)+'</span>';
        }
        if (state.mode === "panhellenic" && slot.participation && slot.participation !== "both"){
          html += '<span class="part-tag '+slot.participation+'" style="cursor:default;" title="'+PARTICIPATION[slot.participation].full+'">'+PARTICIPATION[slot.participation].label+'</span>';
        }
      } else {
        html += '<span style="color:#C7C0AC;">—</span>';
      }
      html += '</div>';
      if (filled && state.stage === "result"){
        html += '<div style="display:flex; align-items:center; gap:3px; flex-shrink:0;">';
        if (state.mode === "panhellenic" && state.rankings){
          if (slot.inIndividual !== false && state.rankings[slot.athleteId]) html += '<span title="Ατομική βαθμολογία τομέα" style="background:'+GOLD+';color:'+NAVY+';border-radius:10px;padding:1px 6px;font-size:10.5px;font-weight:bold;">Α'+state.rankings[slot.athleteId]+'</span>';
          if (slot.inTeam && state.teamRankings && state.teamRankings[slot.athleteId]) html += '<span title="Ομαδική βαθμολογία τομέα" style="background:'+NAVY+';color:#fff;border-radius:10px;padding:1px 6px;font-size:10.5px;font-weight:bold;margin-right:2px;">Ο'+state.teamRankings[slot.athleteId]+'</span>';
        } else if (state.rankings && state.rankings[slot.athleteId]){
          html += '<span style="background:'+GOLD+';color:'+NAVY+';border-radius:10px;padding:1px 7px;font-size:11px;font-weight:bold;margin-right:2px;">'+state.rankings[slot.athleteId]+'ος</span>';
        }
        var isAbs = isChampionship() && state.roundAbsent && state.roundAbsent[slot.athleteId];
        if (isAbs){
          html += '<button class="abs-btn on" onclick="toggleRoundAbsent('+jsStr(slot.athleteId)+')" title="Αναίρεση απουσίας">ΑΠΩΝ ✕</button></div>';
        } else {
          if (isChampionship()) html += '<button class="abs-btn" onclick="toggleRoundAbsent('+jsStr(slot.athleteId)+')" title="Απών σε αυτή την αγωνιστική">Απ</button>';
          if (slot.members && state.drawPairWeigh === "each"){
            var mw = (state.memberWeights && state.memberWeights[slot.athleteId]) || ["", ""];
            [0,1].forEach(function(k){
              if (k) html += '<span style="font-size:11px; color:#8A93A0;">+</span>';
              html += '<input type="text" inputmode="decimal" placeholder="0" title="'+esc(slot.members[k].name)+'" value="'+esc(mw[k] || "")+'" style="width:46px;border:1px solid #CFC7B0;border-radius:4px;padding:3px 4px;font-size:12px;text-align:right;background:#fff;color:'+INK+';" onblur="setMemberWeight('+jsStr(slot.athleteId)+', '+k+', this.value)" />';
            });
            html += '<span style="font-size:11px; color:'+NAVY+'; font-weight:bold; min-width:34px; text-align:right;">='+parseWeight(state.weights[slot.athleteId])+'</span>';
          } else
          html += '<input type="text" inputmode="decimal" placeholder="0" value="'+esc(state.weights[slot.athleteId] || "")+'" style="width:62px;border:1px solid #CFC7B0;border-radius:4px;padding:3px 5px;font-size:12.5px;text-align:right;background:#fff;color:'+INK+';" onblur="state.weights['+jsStr(slot.athleteId)+']=this.value.trim(); state.rankings=null; state.teamRankings=null; render();" />';
          html += '<span style="font-size:11px; color:#8A93A0;">γρ.</span></div>';
        }
      }
      html += '</div>';
      if (filled && slot.sponsor){
        html += '<div style="margin-left:40px; margin-top:2px; font-size:10.5px; color:#B8862F; font-style:italic;">'+(slot.members ? 'Χορηγοί: ' : 'Χορηγός: ')+esc(slot.sponsor)+'</div>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  if (state.stage === "result"){
    html += '<div style="display:flex; gap:8px; margin-top:22px; justify-content:center; max-width:420px; margin-left:auto; margin-right:auto;">';
    html += '<input id="saveNameInput" type="text" class="input" style="flex:1;" placeholder="Όνομα κλήρωσης (π.χ. Αγώνας 21/9)" value="'+esc(state.saveNameInput || "")+'" oninput="state.saveNameInput=this.value;" />';
    html += '<button class="btn-primary-sm" onclick="saveCurrentDraw()">💾 Αποθήκευση</button>';
    html += '</div>';
    if (state.mode === "regional"){
      html += regionDatalist();
      html += '<input id="saveRegionInput" type="text" list="regionList" class="input" style="width:100%; margin-top:8px; font-size:13px;" placeholder="Περιφέρεια (π.χ. Κρήτη) — για τη συγκεντρωτική και την κατανομή θέσεων" value="'+esc(state.saveRegionInput || "")+'" oninput="state.saveRegionInput=this.value;" />';
    }
    var RI = state.raceInfo || {};
    html += '<details style="max-width:420px; margin:10px auto 0;"'+(RI.referee||RI.organizer?'':' open')+'><summary style="cursor:pointer; font-size:12.5px; color:'+NAVY+'; font-weight:bold;">📋 Στοιχεία αγώνα (για PDF)'+(RI.referee?' · Αλυτάρχης: '+esc(RI.referee):'')+'</summary>';
    html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px;">';
    var orgClub = organizerClub();
    var clubOpts = state.clubs.filter(function(c){ return !isOpenClub(c); }).sort(function(a,b){ return String(a.name).localeCompare(String(b.name), "el"); });
    html += '<div style="grid-column:1 / 3; display:flex; gap:8px; align-items:center;">';
    html += orgClub && orgClub.logo ? '<img src="'+orgClub.logo+'" alt="" style="width:36px; height:36px; border-radius:50%; object-fit:contain; background:#fff; flex-shrink:0; box-shadow:0 0 0 1px #E4DFCF;" />' : '';
    html += '<select class="input" style="flex:1; font-size:13px;" onchange="setRaceInfo(\'organizer\', this.value); render();">';
    html += '<option value="">— Διοργανωτής σύλλογος —</option>';
    var found = false;
    clubOpts.forEach(function(c){ var sel = normalizeClubName(c.name) === normalizeClubName(RI.organizer || ""); if (sel) found = true; html += '<option value="'+esc(c.name)+'"'+(sel?' selected':'')+'>'+esc(c.name)+'</option>'; });
    if (RI.organizer && !found) html += '<option value="'+esc(RI.organizer)+'" selected>'+esc(RI.organizer)+'</option>';
    html += '</select></div>';
    html += '<input class="input" style="font-size:13px;" placeholder="Τόπος (π.χ. Λιμάνι Σητείας)" value="'+esc(RI.place||"")+'" oninput="setRaceInfo(\'place\', this.value)" />';
    html += '<input class="input" style="font-size:13px;" placeholder="Ημερομηνία (π.χ. 12/10/2026)" value="'+esc(RI.date||"")+'" oninput="setRaceInfo(\'date\', this.value)" />';
    html += '<input class="input" style="grid-column:1 / 3; font-size:13px;" placeholder="Αλυτάρχης (ονοματεπώνυμο)" value="'+esc(RI.referee||"")+'" oninput="setRaceInfo(\'referee\', this.value)" />';
    html += '</div>';
    var SPS = RI.sponsors || [];
    html += '<div style="margin-top:10px; padding-top:8px; border-top:1px dashed #E4DFCF;">';
    html += '<div style="font-size:12px; color:'+NAVY+'; font-weight:bold; margin-bottom:6px;">Χορηγός αγώνα'+(SPS.length > 1 ? ' <span style="font-weight:normal; color:#8A93A0;">(με σειρά εμφάνισης)</span>' : '')+'</div>';
    SPS.forEach(function(sp, i){
      html += '<div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">';
      html += '<label title="Λογότυπο χορηγού" style="width:42px; height:42px; flex-shrink:0; border:1px dashed #CFC7B0; border-radius:5px; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">' +
        (sp.logo ? '<img src="'+sp.logo+'" alt="" style="max-width:100%; max-height:100%; object-fit:contain;" />' : '<span style="font-size:18px;">🖼</span>') +
        '<input type="file" accept="image/*" style="display:none;" onchange="setRaceSponsorLogo('+jsStr(sp.id)+', this.files[0]); this.value=\'\';" /></label>';
      html += '<input class="input" style="flex:1; font-size:13px;" placeholder="'+(i === 0 ? 'Όνομα κύριου χορηγού' : 'Όνομα χορηγού')+'" value="'+esc(sp.name || "")+'" oninput="setRaceSponsorName('+jsStr(sp.id)+', this.value)" />';
      html += '<button class="icon-btn" onclick="removeRaceSponsor('+jsStr(sp.id)+')" title="Διαγραφή χορηγού">✕</button>';
      html += '</div>';
    });
    html += '<button class="btn-link" style="font-size:12.5px;" onclick="addRaceSponsor()">＋ '+(SPS.length ? 'Κι άλλος χορηγός' : 'Χορηγός αγώνα')+'</button>';
    html += '</div>';
    html += '</details>';
    html += '<div style="display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap;">';
    html += '<button class="btn-gold" onclick="computeRankings()">🏆 Κατάταξη τομέων</button>';
    html += '<button class="btn-gold" '+(state.rankings?"":"disabled")+' onclick="openFinalRanking()">🥇 '+(state.mode==="panhellenic"?"Ατομική κατάταξη":"Τελική κατάταξη")+'</button>';
    if (state.mode === "panhellenic"){
      html += '<button class="btn-gold" '+(state.rankings?"":"disabled")+' onclick="openTeamRanking()">👥 Ομαδική κατάταξη</button>';
    }
    html += '<button class="btn-secondary" onclick="exportToExcel()">📊 Export σε Excel</button>';
    html += '<button class="btn-secondary" onclick="printPdf(\'race\')">📄 PDF</button>';
    html += '<button class="btn-secondary" onclick="newDrawSameClubs()">↺ Νέα κλήρωση (ίδιοι σύλλογοι)</button>';
    html += '<button class="btn-ghost" onclick="resetAll()">🗑 Καθαρισμός αθλητών</button>';
    html += '</div>';
  }
  return html;
}

/* ---------- boot ---------- */
(function boot(){
  initDb().then(function(){
    return Promise.all([storageGet(LIBRARY_KEY), storageGet(ROSTER_KEY), storageGet(SAVED_DRAWS_KEY), storageGet(MODE_KEY), storageGet(QUOTA_KEY), storageGet(RACE_INFO_KEY), storageGet(PAIRS_KEY)]);
  }).then(function(results){
    var libVal = results[0], rosterVal = results[1], savedVal = results[2];
    if (libVal){ try { state.library = JSON.parse(libVal); } catch(e){} }
    if (savedVal){ try { state.savedDraws = JSON.parse(savedVal); } catch(e){} }
    var modeVal = null;
    if (results[3]){ try { modeVal = JSON.parse(results[3]); } catch(e){} }
    if (MODES[modeVal]){ state.mode = modeVal; state.stage = "setup"; }
    if (results[6]){ try { var pc0 = JSON.parse(results[6]); if (pc0 && typeof pc0 === "object") state.pairCfg = Object.assign(state.pairCfg, pc0); } catch(e){} }
    if (results[5]){ try { var ri = JSON.parse(results[5]); if (ri && typeof ri === "object") state.raceInfo = Object.assign(state.raceInfo, ri); } catch(e){} }
    if (results[4]){ try { var qv = JSON.parse(results[4]); if (qv && typeof qv === "object") state.quota = Object.assign(state.quota, qv); } catch(e){} }
    var loadedRoster = null;
    if (rosterVal){ try { loadedRoster = JSON.parse(rosterVal); } catch(e){} }
    if (loadedRoster && loadedRoster.length > 0){
      var merged = loadedRoster.map(function(c){ return Object.assign({}, c, { logo: c.logo || DEFAULT_LOGOS[c.name] || null }); });
      DEFAULT_ROSTER_RAW.forEach(function(entry){
        var clubName = entry[0];
        if (!merged.some(function(c){ return c.name === clubName; })){
          merged.push({ id: uid(), name: clubName, color: CLUB_COLORS[merged.length % CLUB_COLORS.length], logo: DEFAULT_LOGOS[clubName] || null, athletes: [] });
        }
      });
      state.clubs = merged;
      ensureOpenClub();
    } else {
      state.clubs = buildDefaultRoster();
      ensureOpenClub();
    }
    state.rosterLoaded = true;
    render();
  });
  render();
})();
</script>
