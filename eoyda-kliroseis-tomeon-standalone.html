<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Κλήρωση &amp; Κατάταξη — Ε.Ο.Υ.Δ.Α.</title>
<style>
  html, body { margin: 0; padding: 0; background: #F6F2E7; font-family: Arial, Helvetica, sans-serif; color: #243244; }
  * { box-sizing: border-box; }
  input, button, textarea { font-family: inherit; }
  .section-title { font-family: Georgia, serif; font-size: 15px; color: #1F3864; margin-bottom: 8px; border-bottom: 2px solid #D4AF37; padding-bottom: 4px; }
  .input { border: 1px solid #CFC7B0; border-radius: 4px; padding: 8px 10px; font-size: 14px; background: #fff; color: #243244; outline: none; }
  .btn-primary-sm { background: #1F3864; color: #fff; border: none; border-radius: 4px; padding: 0 12px; cursor: pointer; height: 36px; }
  .btn-primary-lg { flex:1; background: #1F3864; color: #fff; border: 2px solid #D4AF37; border-radius: 4px; padding: 13px 0; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-primary-lg:disabled { background: #AEB6C2; border-color: #C9CDD4; cursor: not-allowed; }
  .btn-gold { background: #D4AF37; color: #1F3864; border: 2px solid #1F3864; border-radius: 4px; padding: 10px 16px; font-size: 13.5px; font-weight: bold; cursor: pointer; }
  .btn-gold:disabled { background: #E5DCC0; border-color: #C9CDD4; color: #9CA5AF; cursor: not-allowed; }
  .btn-secondary { background: #1F3864; color: #fff; border: none; border-radius: 4px; padding: 10px 16px; font-size: 13.5px; cursor: pointer; }
  .btn-ghost { background: transparent; color: #8A3B3B; border: 1px solid #C9A0A0; border-radius: 4px; padding: 10px 16px; font-size: 13.5px; cursor: pointer; }
  .btn-ghost-sm { background: #fff; color: #8A3B3B; border: 1px solid #C9A0A0; border-radius: 4px; padding: 0 14px; height: 36px; cursor: pointer; }
  .btn-link { background: none; border: none; color: #1F3864; cursor: pointer; font-size: 13px; font-weight: bold; padding: 4px; }
  .icon-btn { background: none; border: none; cursor: pointer; color: #8A93A0; padding: 2px; font-size: 15px; }
  .icon-btn-armed { background: #A33; border: none; cursor: pointer; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .club-card { background: #fff; border: 1px solid #E4DFCF; border-radius: 5px; padding: 12px; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; background: #F6F2E7; border: 1px solid #E4DFCF; border-radius: 20px; padding: 4px 9px; font-size: 12.5px; color: #243244; margin: 0 6px 6px 0; }
  .chip-armed { background: #A33; border-color: #A33; color: #fff; }
  .chip-btn { display: inline-flex; align-items: center; background: #fff; border: 1px solid #CFC7B0; border-radius: 20px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; color: #243244; margin: 0 6px 6px 0; }
  .summary-bar { display: flex; align-items: center; justify-content: space-between; background: #EFEAD9; border: 1px solid #DDD5C0; border-radius: 4px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #5A6472; }
  .error-text { color: #A33; font-size: 13px; margin-bottom: 10px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ var d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }
function jsStr(s){ return "'" + String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'"; }

function computeCapacities(total, n){
  if (n<=0 || total<=0) return [];
  var base = Math.ceil(total/n);
  var capacities = new Array(n).fill(base);
  if (n>1){ capacities[n-1] = total - base*(n-1); } else { capacities[0] = total; }
  return capacities;
}

function parseWeight(raw){
  if (!raw) return 0;
  var d = String(raw).replace(/[^\d]/g, "");
  return d ? parseInt(d, 10) : 0;
}

// Ranks a group of {athleteId, weight} by weight descending: standard
// skip-ranking among those who caught something (ties share a rank, next
// number skipped), plus article 36's rule for zero-catch athletes (they
// all share the average of the remaining tail positions, rounded up).
function rankGroupByWeight(list){
  var result = {};
  var sorted = list.slice().sort(function(a,b){ return b.weight - a.weight; });
  var caught = sorted.filter(function(a){ return a.weight > 0; });
  var zeroCatch = sorted.filter(function(a){ return a.weight === 0; });
  caught.forEach(function(a, idx){
    if (idx > 0 && a.weight === caught[idx-1].weight) result[a.athleteId] = result[caught[idx-1].athleteId];
    else result[a.athleteId] = idx + 1;
  });
  if (zeroCatch.length > 0){
    var nCaught = caught.length;
    var sumTail = zeroCatch.reduce(function(sum, _, i){ return sum + (nCaught + i + 1); }, 0);
    var avg = Math.ceil(sumTail / zeroCatch.length);
    zeroCatch.forEach(function(a){ result[a.athleteId] = avg; });
  }
  return result;
}

}

/* ---------- persistent storage (best effort: Claude db > Claude window.storage > browser localStorage) ---------- */
var dbNS = null;
var LS_PREFIX = "eoyda_klirosi_";
function initDb(){
  return new Promise(function(resolve){
    try {
      if (typeof claude !== "undefined" && claude && claude.use) {
        claude.use("db").then(function(ns){ dbNS = ns; resolve(); }).catch(function(){ resolve(); });
      } else { resolve(); }
    } catch(e){ resolve(); }
  });
}
function storageGet(key){
  return new Promise(function(resolve){
    if (dbNS){
      dbNS.doc(key).get().then(function(snap){
        resolve(snap && snap.exists ? JSON.stringify(snap.data().value) : null);
      }).catch(function(){ resolve(null); });
      return;
    }
    if (typeof window !== "undefined" && window.storage){
      try {
        window.storage.get(key, false).then(function(res){ resolve(res ? res.value : null); }).catch(function(){ resolve(null); });
      } catch(e){ resolve(null); }
      return;
    }
    // Plain hosting (e.g. GitHub Pages): fall back to the browser's own storage.
    try {
      if (typeof localStorage === "undefined") return resolve(null);
      resolve(localStorage.getItem(LS_PREFIX + key));
    } catch(e){ resolve(null); }
  });
}
function storageSet(key, value){
  if (dbNS){
    try { dbNS.doc(key).set({ value: JSON.parse(value) }).catch(function(){}); } catch(e){}
    return;
  }
  if (typeof window !== "undefined" && window.storage){
    try { window.storage.set(key, value, false).catch(function(){}); } catch(e){}
    return;
  }
  try { if (typeof localStorage !== "undefined") localStorage.setItem(LS_PREFIX + key, value); } catch(e){}
}

  library: [],
  stage: "setup", // setup | drawing | result | manage | savedDraws | finalRanking
  flatAssignments: [],
  sectorCapacities: [],
  revealedCount: 0,
  error: "",
  pendingDelete: null,
  editingSponsorFor: null,
  rosterLoaded: false,
  weights: {},
  rankings: null,
  finalStandings: [],
  savedDraws: [],
  saveNameInput: ""
};
var revealTimer = null;
var pendingDeleteTimer = null;

function totalAthletes(){ return state.clubs.reduce(function(s,c){ return s + c.athletes.length; }, 0); }
function activeClubs(){ return state.clubs.filter(function(c){ return c.athletes.length > 0; }); }
function canDraw(){ return state.numSectors >= 1 && activeClubs().length > 0 && totalAthletes() > 0; }
function sortedClubs(){ return state.clubs.slice().sort(function(a,b){ return b.athletes.length - a.athletes.length; }); }
function findClub(id){ return state.clubs.find(function(c){ return c.id === id; }); }

/* ---------- mutations ---------- */
function upsertLibrary(name, logo){
  var idx = state.library.findIndex(function(l){ return l.name === name; });
  if (idx === -1) state.library.push({ name: name, logo: logo || null });
  else if (logo !== undefined) state.library[idx].logo = logo;
  storageSet(LIBRARY_KEY, JSON.stringify(state.library));
}

function addClub(name, logo){
  var trimmed = (name||"").trim();
  if (!trimmed) return;
  if (state.clubs.some(function(c){ return c.name.toLowerCase() === trimmed.toLowerCase(); })){
    state.error = "Ο σύλλογος υπάρχει ήδη στη λίστα.";
    render(); return;
  }
  state.error = "";
  var color = CLUB_COLORS[state.clubs.length % CLUB_COLORS.length];
  state.clubs.push({ id: uid(), name: trimmed, color: color, logo: logo || null, athletes: [] });
  upsertLibrary(trimmed, logo || null);
  persistRoster();
  render();
}

function confirmOrRun(key, action){
  if (state.pendingDelete === key){
    clearTimeout(pendingDeleteTimer);
    state.pendingDelete = null;
    action();
    persistRoster();
    render();
  } else {
    state.pendingDelete = key;
    clearTimeout(pendingDeleteTimer);
    pendingDeleteTimer = setTimeout(function(){ state.pendingDelete = null; render(); }, 3000);
    render();
  }
}

function removeClub(id){
  confirmOrRun("club-"+id, function(){
    state.clubs = state.clubs.filter(function(c){ return c.id !== id; });
  });
}

function removeAthlete(clubId, athleteId){
  confirmOrRun("athlete-"+athleteId, function(){
    var c = findClub(clubId);
    if (c) c.athletes = c.athletes.filter(function(a){ return a.id !== athleteId; });
  });
}

function handleLogoFile(clubId, file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var c = findClub(clubId);
    if (c){ c.logo = reader.result; upsertLibrary(c.name, reader.result); persistRoster(); render(); }
  };
  reader.readAsDataURL(file);
}

function setClubLogoUrl(clubId, url){
  var c = findClub(clubId);
  if (!c || !url) return;
  c.logo = url;
  upsertLibrary(c.name, url);
  persistRoster();
  render();
}

function updateAthleteSponsor(clubId, athleteId, sponsor){
  var c = findClub(clubId);
  if (c){
    var a = c.athletes.find(function(x){ return x.id === athleteId; });
    if (a) a.sponsor = sponsor;
  }
  state.editingSponsorFor = null;
  persistRoster();
  render();
}

function addAthlete(clubId){
  var input = document.getElementById("athleteInput-"+clubId);
  var value = input ? input.value.trim() : "";
  if (!value) return;
  var sponsorInput = document.getElementById("sponsorInput-"+clubId);
  var sponsor = sponsorInput ? sponsorInput.value.trim() : "";
  var c = findClub(clubId);
  if (!c) return;
  c.athletes.push({ id: uid(), name: value, sponsor: sponsor });
  if (sponsorInput) sponsorInput.value = "";
  persistRoster();
  render();
}

function bulkImport(){
  var textarea = document.getElementById("bulkText");
  var text = textarea ? textarea.value : "";
  var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
  var additions = [];
  lines.forEach(function(line){
    var parts = line.split(/	|,|;/).map(function(p){ return p.trim(); }).filter(Boolean);
    if (parts.length >= 2) additions.push({ name: parts[0], club: parts[1], sponsor: parts[2] || "" });
  });
  if (additions.length === 0){ state.error = "Δεν βρέθηκαν έγκυρες γραμμές (μορφή: Όνομα, Σύλλογος[, Χορηγός] ανά γραμμή)."; render(); return; }
  state.error = "";
  additions.forEach(function(a){
    var c = state.clubs.find(function(cl){ return cl.name.toLowerCase() === a.club.toLowerCase(); });
    if (!c){
      var fromLib = state.library.find(function(l){ return l.name.toLowerCase() === a.club.toLowerCase(); });
      c = { id: uid(), name: a.club, color: CLUB_COLORS[state.clubs.length % CLUB_COLORS.length], logo: fromLib ? fromLib.logo : null, athletes: [] };
      state.clubs.push(c);
    }
    c.athletes.push({ id: uid(), name: a.name, sponsor: a.sponsor || "" });
  });
  var uniqueClubs = Array.from(new Set(additions.map(function(a){ return a.club; })));
  uniqueClubs.forEach(function(clubName){
    if (!state.library.some(function(l){ return l.name.toLowerCase() === clubName.toLowerCase(); })) upsertLibrary(clubName, null);
  });
  if (textarea) textarea.value = "";
  persistRoster();
  render();
}

function commitNumSectors(){
  var input = document.getElementById("numSectorsInput");
  var n = Math.max(1, parseInt(input.value) || 1);
  state.numSectors = n;
  input.value = String(n);
}
function commitNumSectorsAndRender(){ commitNumSectors(); render(); }

function runDraw(){
  var input = document.getElementById("numSectorsInput");
  if (input) commitNumSectors();
  if (!canDraw()) return;

  var total = totalAthletes();
  var capacities = computeCapacities(total, state.numSectors);
  if (capacities.length === 0 || capacities[capacities.length-1] < 1){
    state.error = "Πολλοί τομείς σε σχέση με τον αριθμό αθλητών — μείωσε τον αριθμό τομέων.";
    render(); return;
  }
  state.error = "";
  var numSectors = state.numSectors;

  var working = shuffle(activeClubs().map(function(c){
    return { id:c.id, name:c.name, color:c.color, logo:c.logo, remaining: c.athletes.map(function(a){ return {id:a.id, name:a.name, sponsor:a.sponsor}; }) };
  }));

  var baseCount = working.map(function(c){ return Math.floor(c.remaining.length / numSectors); });
  var remainder = working.map(function(c,i){ return c.remaining.length - baseCount[i]*numSectors; });
  var BASE = baseCount.reduce(function(a,b){return a+b;}, 0);

  var sectorPerm = shuffle(Array.from({length:numSectors}, function(_,k){return k;}));

  var numClubs = working.length;
  var S = 0;
  function clubNode(i){ return 1+i; }
  function sectorNode(j){ return 1+numClubs+j; }
  var T = 1+numClubs+numSectors;
  var N = T+1;
  var cap = Array.from({length:N}, function(){ return new Array(N).fill(0); });
  working.forEach(function(c,i){
    cap[S][clubNode(i)] = remainder[i];
    for (var j=0;j<numSectors;j++) cap[clubNode(i)][sectorNode(j)] = 1;
  });
  for (var j=0;j<numSectors;j++) cap[sectorNode(j)][T] = Math.max(0, capacities[sectorPerm[j]] - BASE);

  function bfsAugmentingPath(){
    var parent = new Array(N).fill(-1);
    parent[S] = S;
    var queue = [S];
    while (queue.length){
      var u = queue.shift();
      for (var v=0; v<N; v++){
        if (parent[v]===-1 && cap[u][v]>0){
          parent[v]=u;
          if (v===T) return parent;
          queue.push(v);
        }
      }
    }
    return null;
  }
  for (var path=bfsAugmentingPath(); path; path=bfsAugmentingPath()){
    var aug = Infinity;
    for (var v=T; v!==S; v=path[v]) aug = Math.min(aug, cap[path[v]][v]);
    for (var v=T; v!==S; v=path[v]){ cap[path[v]][v]-=aug; cap[v][path[v]]+=aug; }
  }

  var extraSectors = working.map(function(){ return new Set(); });
  working.forEach(function(c,i){
    for (var j=0;j<numSectors;j++){
      if (cap[sectorNode(j)][clubNode(i)] > 0) extraSectors[i].add(sectorPerm[j]);
    }
  });

  var filled = new Array(numSectors).fill(0);
  var groups = [];
  working.forEach(function(c,i){
    var group = [];
    for (var b=0; b<baseCount[i]; b++){
      var perm = shuffle(Array.from({length:numSectors}, function(_,k){return k;}));
      perm.forEach(function(s){
        var athlete = c.remaining.shift();
        filled[s]++;
        group.push({ athlete:athlete, club:c, sector:s });
      });
    }
    shuffle(Array.from(extraSectors[i])).forEach(function(s){
      var athlete = c.remaining.shift();
      if (!athlete) return;
      filled[s]++;
      group.push({ athlete:athlete, club:c, sector:s });
    });
    if (group.length>0) groups.push(group);
  });

  var sectorOffsets = [];
  (function(){
    var running = 0;
    for (var i=0;i<capacities.length;i++){ sectorOffsets.push(running); running += capacities[i]; }
  })();
  var perSectorCounter = new Array(numSectors).fill(0);
  var flatChrono = shuffle([].concat.apply([], groups));
  var flat = flatChrono.map(function(g){
    var localIndex = perSectorCounter[g.sector]++;
    var position = sectorOffsets[g.sector] + localIndex + 1;
    return { athleteId: g.athlete.id, athleteName: g.athlete.name, sponsor: g.athlete.sponsor || "", clubName: g.club.name, color: g.club.color, logo: g.club.logo, sector: g.sector, position: position };
  });

  state.sectorCapacities = capacities;
  state.flatAssignments = flat;
  state.revealedCount = 0;
  state.weights = {};
  state.rankings = null;
  state.stage = "drawing";
  render();

  clearInterval(revealTimer);
  revealTimer = setInterval(function(){
    state.revealedCount++;
    if (state.revealedCount >= state.flatAssignments.length){
      clearInterval(revealTimer);
      state.stage = "result";
    }
    render();
  }, 420);
}

/* ---------- scoring ---------- */
function computeRankings(){
  var result = {};
  var isTechnical = state.sectorCapacities.length > 0 && state.sectorCapacities[state.sectorCapacities.length-1] !== state.sectorCapacities[0];
  var lastIdx = state.numSectors - 1;
  var diff = isTechnical ? state.sectorCapacities[0] - state.sectorCapacities[lastIdx] : 0;

  function toWeighted(sectorIdx){
    return state.flatAssignments.filter(function(a){ return a.sector === sectorIdx; })
      .map(function(a){ return { athleteId: a.athleteId, weight: parseWeight(state.weights[a.athleteId]) }; });
  }

  for (var s=0; s<state.numSectors; s++){
    if (isTechnical && s === lastIdx) continue;
    Object.assign(result, rankGroupByWeight(toWeighted(s)));
  }

  if (isTechnical){
    var secondToLastIdx = lastIdx - 1;
    var sectorOffsets = [];
    (function(){ var running=0; for (var i=0;i<state.sectorCapacities.length;i++){ sectorOffsets.push(running); running+=state.sectorCapacities[i]; } })();
    var secondToLastCapacity = state.sectorCapacities[secondToLastIdx];
    var secondToLastAthletes = state.flatAssignments.filter(function(a){ return a.sector === secondToLastIdx; });
    // Borrow whoever physically sits in the last `diff` positions of the
    // second-to-last sector (bordering the technical sector) — fixed by the
    // draw itself, not by weight.
    var borrowed = secondToLastAthletes
      .filter(function(a){ return (a.position - sectorOffsets[secondToLastIdx]) > (secondToLastCapacity - diff); })
      .map(function(a){ return { athleteId: a.athleteId, weight: parseWeight(state.weights[a.athleteId]) }; });
    var technicalReal = toWeighted(lastIdx);
    var combined = technicalReal.concat(borrowed.map(function(b){ return { athleteId: "__borrowed__"+b.athleteId, weight: b.weight }; }));
    var combinedRanks = rankGroupByWeight(combined);
    technicalReal.forEach(function(a){ result[a.athleteId] = combinedRanks[a.athleteId]; });
  }

  state.rankings = result;
  render();
}

function openFinalRanking(){
  if (!state.rankings) return;
  var nameInput = document.getElementById("saveNameInput");
  if (nameInput) state.saveNameInput = nameInput.value;
  var rankings = state.rankings, weights = state.weights;
  var sectorOffsets = [];
  (function(){ var running=0; for (var i=0;i<state.sectorCapacities.length;i++){ sectorOffsets.push(running); running+=state.sectorCapacities[i]; } })();
  var sorted = state.flatAssignments.slice().sort(function(a,b){
    var scoreDiff = (rankings[a.athleteId]||0) - (rankings[b.athleteId]||0);
    if (scoreDiff !== 0) return scoreDiff;
    return parseWeight(weights[b.athleteId]) - parseWeight(weights[a.athleteId]);
  });
  var withPlace = [];
  sorted.forEach(function(a, idx){
    var prev = sorted[idx-1];
    var samePlace = idx > 0 && rankings[a.athleteId] === rankings[prev.athleteId] && parseWeight(weights[a.athleteId]) === parseWeight(weights[prev.athleteId]);
    withPlace.push(Object.assign({}, a, {
      score: rankings[a.athleteId],
      weight: parseWeight(weights[a.athleteId]),
      localPosition: a.position - sectorOffsets[a.sector],
      place: samePlace ? withPlace[idx-1].place : idx+1
    }));
  });
  state.finalStandings = withPlace;
  state.stage = "finalRanking";
  render();
}

// Exports the official-style Φύλλο Αγώνα as CSV (opens directly in Excel) —
// no external library needed, so downloads work reliably in any real browser.
// ΘΕΣΗ = sector letter + continuous position (e.g. "D24" = sector Δ, position 24).
function csvCell(v){
  v = v === null || v === undefined ? "" : String(v);
  if (/[";\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function downloadCsv(filename, header, rows){
  var lines = [header.map(csvCell).join(";")];
  rows.forEach(function(row){ lines.push(row.map(csvCell).join(";")); });
  var csv = "\uFEFF" + lines.join("\r\n"); // BOM so Excel reads Greek/UTF-8 correctly
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function exportToExcel(){
  var sectorLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var rows = state.flatAssignments.slice().sort(function(a,b){ return a.position - b.position; });
  var header = ["Α/Α","ΘΕΣΗ","ΟΝΟΜΑ ΑΘΛΗΤΗ","ΣΥΛΛΟΓΟΣ","ΧΟΡΗΓΟΣ","ΒΑΡΟΣ","Β. ΠΟΙΝΗΣ"];
  var csvRows = rows.map(function(a, idx){
    var weight = parseWeight(state.weights[a.athleteId]);
    var score = state.rankings ? (state.rankings[a.athleteId] != null ? state.rankings[a.athleteId] : "") : "";
    return [
      idx+1,
      (sectorLetters[a.sector] || (a.sector+1)) + a.position,
      a.athleteName,
      a.clubName,
      a.sponsor || "",
      weight || "",
      score
    ];
  });
  var today = new Date().toISOString().slice(0,10);
  downloadCsv("Fyllo_Agona_" + today + ".csv", header, csvRows);
}

function exportFinalRankingToExcel(){
  var header = ["ΤΕΛΙΚΗ ΘΕΣΗ","ΟΝΟΜΑ ΑΘΛΗΤΗ","ΣΥΛΛΟΓΟΣ","ΧΟΡΗΓΟΣ","ΤΟΜΕΑΣ","ΘΕΣΗ ΣΤΟΝ ΤΟΜΕΑ","ΒΑΡΟΣ","Β. ΠΟΙΝΗΣ"];

    return [a.place, a.athleteName, a.clubName, a.sponsor || "", sectorLabel(a.sector), a.localPosition, a.weight || "", a.score];
  });
  var title = (state.saveNameInput || "").trim();
  var today = new Date().toISOString().slice(0,10);
  downloadCsv("Teliki_Katataxi" + (title ? "_" + title.replace(/[^\w\u0370-\u03FF\u1F00-\u1FFF]+/g, "_") : "") + "_" + today + ".csv", header, csvRows);
}

      html += '<span style="flex:1; font-size:13.5px;">'+esc(a.name)+'</span>';
      if (armed){
        html += '<button class="icon-btn-armed" onclick="removeAthlete('+jsStr(club.id)+', '+jsStr(a.id)+')" style="margin-right:6px;">Οριστική διαγραφή</button>';
        html += '<button class="btn-ghost-sm" onclick="state.pendingDelete=null; render();">Άκυρο</button>';
      } else {
        html += '<button class="icon-btn" onclick="removeAthlete('+jsStr(club.id)+', '+jsStr(a.id)+')">✕</button>';
      }
      html += '</div>';
    });
    html += '</div>';
  });

  var resetArmed = state.pendingDelete === "reset-all";
  html += '<div style="margin-top:20px; text-align:center;">';
  if (resetArmed){
    html += '<button class="icon-btn-armed" onclick="resetAll()" style="margin-right:8px;">Οριστική διαγραφή όλων</button>';
    html += '<button class="btn-ghost-sm" onclick="state.pendingDelete=null; render();">Άκυρο</button>';
  } else {
    html += '<button class="btn-ghost" onclick="resetAll()">🗑 Καθαρισμός όλων</button>';
  }
  html += '</div>';

  return html;
}

function renderSavedDraws(){
  var html = '<div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">';
  html += '<button class="btn-link" onclick="goSetup()">← Πίσω</button>';
  html += '<span style="font-family:Georgia,serif; font-size:16px; color:'+NAVY+';">Αποθηκευμένες κληρώσεις</span>';
  html += '</div>';
  if (state.savedDraws.length === 0) html += '<div style="color:#8A93A0; font-size:13px;">Δεν υπάρχουν αποθηκευμένες κληρώσεις.</div>';
  state.savedDraws.slice().reverse().forEach(function(d){
    var armed = state.pendingDelete === "saved-draw-"+d.id;
    var dateStr = new Date(d.savedAt).toLocaleDateString("el-GR", { day:"2-digit", month:"2-digit", year:"numeric" });
    html += '<div class="club-card"><div style="display:flex; align-items:center; gap:10px;">';
    html += '<div style="flex:1;"><div style="font-weight:bold; color:'+NAVY+'; font-size:14.5px;">'+esc(d.name)+'</div>';
    html += '<div style="font-size:11.5px; color:#8A93A0;">'+dateStr+' · '+d.numSectors+' τομείς · '+d.flatAssignments.length+' αθλητές'+(d.rankings?" · έχει κατάταξη":"")+'</div></div>';
    html += '<button class="btn-primary-sm" style="padding:0 14px;" onclick="loadSavedDraw('+jsStr(d.id)+')">Άνοιγμα</button>';
    html += '<button class="'+(armed?"icon-btn-armed":"icon-btn")+'" onclick="deleteSavedDraw('+jsStr(d.id)+')">'+(armed?"Σίγουρα;":"✕")+'</button>';
    html += '</div></div>';
  });
  return html;
}

function renderFinalRanking(){
  var html = '<div style="text-align:center; margin-bottom:16px;">';
  html += '<div style="font-family:Georgia,serif; font-size:20px; color:'+NAVY+';">Τελική Κατάταξη</div>';
  if (state.saveNameInput && state.saveNameInput.trim()){
    html += '<div style="font-size:13px; color:#B8862F; font-style:italic; margin-top:2px;">'+esc(state.saveNameInput.trim())+'</div>';
  }
  html += '</div>';
  html += '<div style="background:#fff; border:1px solid #E4DFCF; border-radius:5px; overflow:hidden;">';
  state.finalStandings.forEach(function(a, idx){
    var top3 = a.place <= 3;
    html += '<div style="display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:'+(idx===0?"none":"1px solid #F0EBDD")+'; background:'+(top3?"#FBF6E8":"#fff")+';">';
    html += '<div style="width:30px;height:30px;border-radius:50%;background:'+(top3?GOLD:NAVY)+';color:'+(top3?NAVY:"#fff")+';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex-shrink:0;">'+a.place+'</div>';
    if (a.logo) html += '<img src="'+a.logo+'" style="width:20px;height:20px;border-radius:50%;object-fit:cover;" />';
    else html += '<span style="width:11px;height:11px;border-radius:50%;background:'+a.color+';display:inline-block;"></span>';
    html += '<div style="flex:1; min-width:0;"><div style="font-size:14px; color:'+INK+'; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(a.athleteName)+'</div>';
    html += '<div style="font-size:11.5px; color:#8A93A0;">'+esc(a.clubName)+' · Τομέας '+sectorLabel(a.sector)+' / Θέση '+a.localPosition+(a.sponsor?' <span style="color:#B8862F; font-style:italic;">· '+esc(a.sponsor)+'</span>':'')+'</div></div>';
    html += '<div style="text-align:right; flex-shrink:0;"><div style="font-size:13px; font-weight:bold; color:'+NAVY+';">'+a.score+' Β/Π</div>';
    html += '<div style="font-size:11px; color:#8A93A0;">'+a.weight+' γρ.</div></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div style="display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap;">';
  html += '<button class="btn-gold" onclick="exportFinalRankingToExcel()">📊 Export σε Excel</button>';
  html += '<button class="btn-secondary" onclick="state.stage=\'result\'; render();">← Πίσω</button>';
  html += '</div>';
  return html;
}

function renderDraw(){
  var html = '<div style="text-align:center; font-size:13px; color:#5A6472; margin-bottom:16px;">';
  html += state.stage === "drawing"
    ? "Κληρώνονται οι αθλητές… (" + state.revealedCount + "/" + state.flatAssignments.length + ")"
    : "Η κλήρωση ολοκληρώθηκε.";
  html += '</div>';

  var byPosition = new Array(state.flatAssignments.length).fill(null);
  state.flatAssignments.forEach(function(a, chronoIndex){ byPosition[a.position-1] = Object.assign({}, a, {chronoIndex: chronoIndex}); });

  var sectorOffsets = [];
  (function(){ var running=0; for (var i=0;i<state.sectorCapacities.length;i++){ sectorOffsets.push(running); running+=state.sectorCapacities[i]; } })();

  html += '<div style="max-width:440px; margin:0 auto;">';
  state.sectorCapacities.forEach(function(cap, sIdx){
    var isTechnical = state.sectorCapacities.length>0 && cap !== state.sectorCapacities[0];
    var start = sectorOffsets[sIdx]+1, end = sectorOffsets[sIdx]+cap;
    html += '<div style="margin-bottom:18px;">';
    html += '<div style="font-family:Georgia,serif; font-size:14px; color:'+NAVY+'; margin-bottom:8px; padding-bottom:4px; border-bottom:2px solid '+GOLD+';">Τομέας '+sectorLabel(sIdx);
    if (isTechnical) html += '<span style="font-size:11px; color:#B8862F; margin-left:6px;">· Τεχνητός</span>';
    html += '</div>';
    html += '<div style="position:relative; padding-left:4px;">';
    html += '<div style="position:absolute; left:17px; top:4px; bottom:4px; width:2px; background:#E4DFCF;"></div>';
    for (var p=start; p<=end; p++){
      var slot = byPosition[p-1];
      var filled = slot && slot.chronoIndex < state.revealedCount;
      html += '<div style="padding:5px 0;">';
      html += '<div style="display:flex; align-items:center; gap:10px; position:relative;">';
      html += '<div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0;z-index:1;background:'+(filled?NAVY:"#fff")+';border:2px solid '+(filled?GOLD:"#D8D2C0")+';color:'+(filled?"#fff":"#B7BFC9")+';">'+p+'</div>';
      html += '<div style="font-size:13.5px; display:flex; align-items:center; gap:6px; flex:1; min-width:0;">';
      if (filled){
        if (slot.logo) html += '<img src="'+slot.logo+'" style="width:16px;height:16px;border-radius:50%;object-fit:cover;" />';
        else html += '<span style="width:9px;height:9px;border-radius:50%;background:'+slot.color+';display:inline-block;flex-shrink:0;"></span>';
        html += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(slot.athleteName)+'</span><span style="color:#8A93A0; font-size:11px; white-space:nowrap;">· '+esc(slot.clubName)+'</span>';
      } else {
        html += '<span style="color:#C7C0AC;">—</span>';
      }
      html += '</div>';
      if (filled && state.stage === "result"){
        html += '<div style="display:flex; align-items:center; gap:3px; flex-shrink:0;">';
        if (state.rankings && state.rankings[slot.athleteId]){
          html += '<span style="background:'+GOLD+';color:'+NAVY+';border-radius:10px;padding:1px 7px;font-size:11px;font-weight:bold;margin-right:2px;">'+state.rankings[slot.athleteId]+'ος</span>';
        }
        html += '<input type="text" inputmode="decimal" placeholder="0" value="'+esc(state.weights[slot.athleteId] || "")+'" style="width:62px;border:1px solid #CFC7B0;border-radius:4px;padding:3px 5px;font-size:12.5px;text-align:right;background:#fff;color:'+INK+';" onblur="state.weights['+jsStr(slot.athleteId)+']=this.value.trim(); state.rankings=null; render();" />';
        html += '<span style="font-size:11px; color:#8A93A0;">γρ.</span></div>';
      }
      html += '</div>';
      if (filled && slot.sponsor){
        html += '<div style="margin-left:40px; margin-top:2px; font-size:10.5px; color:#B8862F; font-style:italic;">Χορηγός: '+esc(slot.sponsor)+'</div>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  if (state.stage === "result"){
    html += '<div style="display:flex; gap:8px; margin-top:22px; justify-content:center; max-width:420px; margin-left:auto; margin-right:auto;">';
    html += '<input id="saveNameInput" type="text" class="input" style="flex:1;" placeholder="Όνομα κλήρωσης (π.χ. Αγώνας 21/9)" value="'+esc(state.saveNameInput || "")+'" oninput="state.saveNameInput=this.value;" />';
    html += '<button class="btn-primary-sm" onclick="saveCurrentDraw()">💾 Αποθήκευση</button>';
    html += '</div>';
    html += '<div style="display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap;">';
    html += '<button class="btn-gold" onclick="computeRankings()">🏆 Κατάταξη τομέων</button>';
    html += '<button class="btn-gold" '+(state.rankings?"":"disabled")+' onclick="openFinalRanking()">🥇 Τελική κατάταξη</button>';
    html += '<button class="btn-secondary" onclick="exportToExcel()">📊 Export σε Excel</button>';
    html += '<button class="btn-secondary" onclick="newDrawSameClubs()">↺ Νέα κλήρωση (ίδιοι σύλλογοι)</button>';
    html += '<button class="btn-ghost" onclick="resetAll()">🗑 Καθαρισμός όλων</button>';
    html += '</div>';
  }
  return html;
}

/* ---------- boot ---------- */
(function boot(){
  initDb().then(function(){
    return Promise.all([storageGet(LIBRARY_KEY), storageGet(ROSTER_KEY), storageGet(SAVED_DRAWS_KEY)]);
  }).then(function(results){
    var libVal = results[0], rosterVal = results[1], savedVal = results[2];
    if (libVal){ try { state.library = JSON.parse(libVal); } catch(e){} }
    if (savedVal){ try { state.savedDraws = JSON.parse(savedVal); } catch(e){} }
    var loadedRoster = null;
    if (rosterVal){ try { loadedRoster = JSON.parse(rosterVal); } catch(e){} }
    if (loadedRoster && loadedRoster.length > 0){
      var merged = loadedRoster.map(function(c){ return Object.assign({}, c, { logo: c.logo || DEFAULT_LOGOS[c.name] || null }); });
      DEFAULT_ROSTER_RAW.forEach(function(entry){
        var clubName = entry[0];
        if (!merged.some(function(c){ return c.name === clubName; })){
          merged.push({ id: uid(), name: clubName, color: CLUB_COLORS[merged.length % CLUB_COLORS.length], logo: DEFAULT_LOGOS[clubName] || null, athletes: [] });
        }
      });
      state.clubs = merged;
    } else {
      state.clubs = buildDefaultRoster();
    }
    state.rosterLoaded = true;
    render();
  });
  render();
})();
</script>
